<style>

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;

body{background:var(--paper);padding:var(--s5);

.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;

.welcome-ico{color:var(--ink-soft)}

.welcome-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.welcome-t{font-size:0.9rem;font-weight:500;color:var(--ink-soft);line-height:1.6;max-width:26rem}
.welcome-cta{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;

.confetti{position:fixed;width:9px;height:9px;border-radius:2px;top:-20px;
  pointer-events:none;z-index:60;animation:fall linear forwards}
.toast{position:fixed;left:50%;bottom:var(--s7);transform:translateX(-50%) translateY(140%);
  background:var(--surface);border:1.5px solid var(--ac-bd);border-radius:var(--r3);
  padding:var(--s4) var(--s6);box-shadow:var(--e2);text-align:center;z-index:70;
  transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:min(92vw,26rem);
  display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-med{width:2.6rem;height:2.6rem;border-radius:var(--rf);background:var(--ac);
  color:var(--on-ac);display:flex;align-items:center;justify-content:center}
.toast-med .ico{width:1.5rem;height:1.5rem;stroke-width:1.6}
.toast-h{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft)}
.toast-name{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.toast-tag{font-size:0.85rem;font-weight:500;color:var(--ink-soft);font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>

<script>
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
const SNDS={
  hover:()=>tn(1000,1200,.06,.03,0,'triangle'),
  select:()=>{[523,654,784].forEach((f,i)=>tn(f,f,.15,.045,i*.06,'triangle'))},
  acquis:()=>{ns(2200,.02,.08,0);[659,988].forEach((f,i)=>tn(f,f,.2,.05,i*.07,'triangle'))},
  rang:()=>{tn(1568,1568,.55,.05,0,'sine');tn(2093,2093,.45,.03,.03,'sine');
            [523,784,1047].forEach((f,i)=>tn(f,f,.3,.05,.12+i*.1,'triangle'))}
};

const CARTES=[
{n:1,pill:"Le mécanisme",titre:"Un impôt qui transite par la caisse",
 st:"Collectée sur les ventes, déduite sur les achats",
 stats:[["4", "taux en métropole"], ["1954", "année de la loi"], ["0", "coût s'il est juste"]],
 body:"La TVA est payée par le client final, mais c'est l'établissement qui la calcule, l'encaisse et la reverse. Sur chaque vente, il ajoute la <strong>TVA collectée</strong> au hors taxes ; sur chaque achat, il paie une <strong>TVA déductible</strong> à ses fournisseurs. Chaque mois, il reverse la différence. Ce qui lui appartient, c'est le hors taxes : c'est sur lui que se calculent le chiffre d'affaires et tous les indicateurs de l'activité.",
 rule:"Une TVA collectée trop basse ne pénalise pas le client, qui a payé le prix affiché : la différence est due par la maison, sur ses propres recettes.",
 svg:`<svg class="fig-svg" viewBox="0 0 320 158" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Le circuit de la TVA dans un hôtel">
  <rect class="fig-a" x="10" y="12" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="32">TVA collectée</text>
  <text class="fig-t soft end" x="298" y="32">sur les ventes</text>
  <rect class="fig-a" x="10" y="46" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="66">TVA déductible</text>
  <text class="fig-t soft end" x="298" y="66">sur les achats</text>
  <rect class="fig-b" x="10" y="80" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="100">Différence</text>
  <text class="fig-t soft end" x="298" y="100">reversée</text>
  <text class="fig-t soft mid" x="160" y="142">La maison ne garde que le HT</text>
 </svg>`},

{n:2,pill:"Le critère",titre:"La nature décide du taux, jamais le prix",
 st:"Une question précède tout calcul",
 stats:[["10 %", "logement et repas"], ["20 %", "services, alcool"], ["5,5 %", "denrées emportées"]],
 body:"Le taux d'une ligne ne dépend ni de son montant, ni du client, ni du canal de vente. Il dépend de <strong>ce qui est fourni</strong> : un toit pour la nuit, un repas ou une boisson servis, un service distinct de l'hébergement, ou un produit emporté. Dans le logiciel, la question a été tranchée au paramétrage : chaque <strong>code de prestation</strong> porte son taux, et chaque ligne saisie sous ce code en hérite, sans aucun message d'erreur s'il est mal choisi.",
 rule:"Le contrôle lit le libellé avant le montant : une ligne saisie sous un mauvais code calcule juste sur une base fausse.",
 svg:`<svg class="fig-svg" viewBox="0 0 320 192" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Quatre natures de prestation et leur taux">
  <rect class="fig-a" x="10" y="12" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="32">Un logement</text>
  <text class="fig-t soft end" x="298" y="32">10 %</text>
  <rect class="fig-a" x="10" y="46" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="66">Un repas servi</text>
  <text class="fig-t soft end" x="298" y="66">10 %</text>
  <rect class="fig-a" x="10" y="80" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="100">Un service</text>
  <text class="fig-t soft end" x="298" y="100">20 %</text>
  <rect class="fig-a" x="10" y="114" width="300" height="30" rx="5"/>

const RANKS=[
 {min:0,name:"Taux à poser",ico:"ico-pensif",tag:"« La nature décide du taux. »"},
 {min:200,name:"Frontières repérées",ico:"ico-niveau",tag:"« L'alcool passe à 20 %, même à table. »"},
 {min:400,name:"Calcul tenu",ico:"ico-badge",tag:"« On divise par le coefficient. »"},
 {min:600,name:"Facture lisible",ico:"ico-medaille",tag:"« Une base et une TVA par taux. »"},
 {min:700,name:"TVA maîtrisée",ico:"ico-trophee",tag:"« Le libellé se lit avant le montant. »"}
];
const rankOf=x=>RANKS.filter(r=>x>=r.min).pop();

const $=id=>document.getElementById(id);
const XP_CARTE=100, XP_MAX=CARTES.length*XP_CARTE;
let acquises=new Set(),courante=null,rangCourant=RANKS[0].name;

function peintSidebar(){
  $('stepList').innerHTML=CARTES.map(c=>
    `<button class="step${courante===c.n?' on':''}" data-n="${c.n}">
      <span class="step-n">${c.n}</span><span>${c.titre}</span>
      ${acquises.has(c.n)?'<span class="step-ok" aria-label="acquise">✓</span>':''}
    </button>`).join('');
  document.querySelectorAll('.step').forEach(b=>{
    b.addEventListener('mouseenter',()=>SNDS.hover());
    b.addEventListener('click',()=>{SNDS.select();ouvre(+b.dataset.n)})});
}
function welcome(){
  $('main').innerHTML=`
  <div class="welcome">
    <div class="welcome-ico"><svg class="ico" aria-hidden="true"><use href="#ico-pourcentage"/></svg></div>
    <div class="welcome-h">Sept cartes, de la nature d'une prestation à son taux</div>
    <div class="welcome-t">Du circuit de la TVA collectée et déductible jusqu'au contrôle d'une facture composite, en passant par le critère qui rattache chaque prestation à son taux, la frontière de l'alcool, le calcul du hors taxes, le bloc de TVA d'une facture et les deux sommes qui sortent de toute base. Marquez chaque carte comme acquise.</div>
    <div class="welcome-cta">Choisissez une carte</div>
  </div>`;
}
function ouvre(n){
  const c=CARTES.find(x=>x.n===n);courante=n;
  $('main').innerHTML=`
    <div class="card-hd">
      <div><div class="card-t">${c.titre}</div><div class="card-st">${c.st}</div></div>
      <span class="pill">${c.pill}</span>
    </div>
    <div class="scroll-zone" style="display:flex;flex-direction:column;gap:var(--s4);min-height:0">
      <div class="figure">${c.svg}</div>
      <div class="quick-stat">${c.stats.map(([v,l])=>
        `<div class="stat"><div class="stat-val">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}</div>
      <div class="body">${c.body}</div>
      <div class="vigilance">${c.rule}</div>
    </div>
    <div class="bar">
      <div class="dots-nav" id="dots"></div>
      <button class="nbtn primary" id="acq" ${acquises.has(n)?'disabled':''}>
        <svg class="ico" aria-hidden="true"><use href="#ico-valider"/></svg>
        ${acquises.has(n)?'Carte acquise':'Marquer comme acquise'}
      </button>
    </div>`;
  peintDots();peintSidebar();
  $('acq').addEventListener('click',()=>acquiert(n));
  if(window.matchMedia('(max-width:880px)').matches){
    $('main').scrollIntoView({behavior:'smooth',block:'start'})}
}
function peintDots(){
  $('dots').innerHTML=CARTES.map(c=>{
    let cl='dot';
    if(c.n===courante)cl+=' now';else if(acquises.has(c.n))cl+=' done';
    return `<span class="${cl}" data-n="${c.n}" role="button" tabindex="0" aria-label="Carte ${c.n}"></span>`
  }).join('');
  document.querySelectorAll('.dot').forEach(d=>{
    const go=()=>{SNDS.select();ouvre(+d.dataset.n)};
    d.addEventListener('click',go);
    d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
}
function acquiert(n){
  if(acquises.has(n))return;
  acquises.add(n);SNDS.acquis();majXp();peintSidebar();
  const b=$('acq');b.disabled=true;
  b.innerHTML='<svg class="ico" aria-hidden="true"><use href="#ico-valider"/></svg> Carte acquise';
  peintDots();
}
function majXp(){
  const xp=acquises.size*XP_CARTE;
  $('xpFill').style.width=(xp/XP_MAX*100)+'%';
  $('xpVal').textContent=xp+' / '+XP_MAX+' XP';
  const r=rankOf(xp);
  $('badgeName').textContent=r.name;
  $('badgeMed').innerHTML=`<svg class="ico" aria-hidden="true"><use href="#${r.ico}"/></svg>`;
  if(r.name!==rangCourant){
    rangCourant=r.name;
    $('toastMed').innerHTML=`<svg class="ico" aria-hidden="true"><use href="#${r.ico}"/></svg>`;
    $('toastName').textContent=r.name;$('toastTag').textContent=r.tag;
    const t=$('toast');t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),4200);
    SNDS.rang();confettis();
  }
}
function confettis(){
  const cols=['#64748B','#7A899F','#6B6560','#E1E5EA','#323232'];
  for(let i=0;i<55;i++){const c=document.createElement('div');c.className='confetti';
    c.style.background=cols[i%cols.length];c.style.left=Math.random()*100+'vw';
    c.style.animationDelay=(Math.random()*.6)+'s';
    c.style.animationDuration=(2+Math.random()*1.8)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}}
(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
  val.addEventListener('click',()=>{i=STEPS.indexOf(1);apply()});apply()})();
peintSidebar();welcome();majXp();
</script>
</body>
