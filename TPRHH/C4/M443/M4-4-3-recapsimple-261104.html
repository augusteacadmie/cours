<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports d'activité · L'essentiel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rf:999px;
  --e1:0 1px 3px rgba(0,0,0,.06);--e2:0 4px 16px rgba(0,0,0,.08);--e3:0 12px 32px -8px rgba(0,0,0,.22);
  --ink:#323232;--ink-body:#323232;--ink-soft:#6B6560;--line:rgba(0,0,0,.10);
  --surface:#FAFAFA;
  --paper:#F2F3F5;--ac:#64748B;--on-ac:#FAFAFA;--ac-bg:#E1E5EA;--ac-bd:#7A899F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
/* Racine reduite de 20 % (design-tokens.md §1) : le reglage precedent
   (17-22px) poussait le contenu hors de l'ecran sur les formats moyens.
   Corps de texte effectif : 13 a 17,5px. Aucun token individuel retouche. */
html{font-size:calc(clamp(13.5px, 0.84vw + 8px, 17.5px) * var(--z, 1))}
body{background:var(--paper);padding:var(--s5);
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:var(--s4);color:var(--ink-body)}
@media (min-width:881px){
  html,body{height:100%;min-height:0;overflow:hidden}
  body{padding:var(--s7);padding-bottom:var(--s7)}
}
html.zoomed,html.zoomed body{height:auto;min-height:100%;overflow:auto}
.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  flex-wrap:wrap}
.h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:var(--s1);
  letter-spacing:-.01em;line-height:1.2}
.sub{font-size:0.85rem;font-weight:500;color:var(--ink-soft)}
.top-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.mini-badge{display:inline-flex;align-items:center;gap:var(--s2);
  background:var(--ac);color:var(--on-ac);border-radius:var(--rf);
  padding:var(--s2) var(--s4);font-size:0.68rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase}
.zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:3px;flex-shrink:0}
.zoom-btn,.zoom-val{font-family:inherit;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);font-weight:800;transition:background .15s;border-radius:var(--r1)}
.zoom-btn{width:1.6rem;height:1.6rem;font-size:0.95rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.zoom-btn:hover,.zoom-val:hover{background:var(--ac-bg);color:var(--ink)}
.zoom-val{min-width:2.6rem;height:1.6rem;font-size:0.68rem;letter-spacing:.02em}

.tabs{display:flex;gap:var(--s2);flex-wrap:wrap}
.tab{font-family:inherit;font-size:0.95rem;font-weight:700;padding:var(--s3) var(--s6);
  min-height:48px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  color:var(--ink);border-radius:var(--r2);transition:background .15s,border-color .15s;
  display:inline-flex;align-items:center;gap:var(--s2)}
.tab:hover{background:var(--ac-bg)}
.tab.is-on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.panel{display:none;flex:1;flex-direction:column;gap:var(--s4);min-height:0}
.panel.is-on{display:flex;animation:fadeUp .3s both}
.grid{flex:1;display:grid;gap:var(--s4);grid-template-columns:repeat(2,1fr);
  align-content:stretch;min-height:0}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.point{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r4);
  padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);box-shadow:var(--e1);
  animation:popIn .4s both;min-height:0}
.point:nth-child(2){animation-delay:.06s}
.point:nth-child(3){animation-delay:.12s}
.point:nth-child(4){animation-delay:.18s}
.pt-hd{display:flex;align-items:center;gap:var(--s3)}
.pt-ico{width:2.1rem;height:2.1rem;border-radius:var(--r1);background:var(--ac-bg);
  color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pt-ico .ico{width:1.2rem;height:1.2rem;stroke-width:1.7}
.pt-ttl{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.pt-txt{font-size:0.95rem;font-weight:500;color:var(--ink-body);line-height:1.6;
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ac-bd) transparent}
.pt-txt::-webkit-scrollbar{width:4px}
.pt-txt::-webkit-scrollbar-thumb{background:var(--ac-bd);border-radius:2px}
.pt-txt strong{font-weight:700;color:var(--ink)}

.keep{background:var(--ac);color:var(--on-ac);border-radius:var(--r3);
  padding:var(--s4) var(--s6);display:flex;align-items:center;gap:var(--s4);flex-shrink:0}
.keep .ico{width:1.6rem;height:1.6rem;stroke-width:1.7}
.keep-lbl{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  opacity:.75;margin-bottom:2px}
.keep-txt{font-size:0.95rem;font-weight:700;line-height:1.45}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<!--ICONS:START-->
<svg style="display:none" aria-hidden="true">
<symbol id="ico-alerte" viewBox="0 0 24 24"><title>Alerte</title><path d="M12 3.4 21.6 20H2.4Z"/><path d="M12 9.6v4.6"/><path d="M12 17.2v.1"/></symbol>
<symbol id="ico-cadenas" viewBox="0 0 24 24"><title>Verrouillé</title><rect x="4.6" y="10.4" width="14.8" height="10.2" rx="2.2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></symbol>
<symbol id="ico-calendrier" viewBox="0 0 24 24"><title>Calendrier</title><rect x="3.2" y="5" width="17.6" height="16" rx="2.2"/><path d="M3.2 9.8h17.6"/><path d="M8 3v4M16 3v4"/><path d="M7.6 13.6h2M11 13.6h2M14.4 13.6h2M7.6 17h2M11 17h2"/></symbol>
<symbol id="ico-dossier" viewBox="0 0 24 24"><title>Dossier</title><path d="M2.8 6.6a2 2 0 0 1 2-2h4l2.4 2.8h8a2 2 0 0 1 2 2v8.6a2 2 0 0 1-2 2H4.8a2 2 0 0 1-2-2Z"/></symbol>
<symbol id="ico-epingle" viewBox="0 0 24 24"><title>Épingler</title><path d="M9 3.6h6l-.8 6 3.4 3.2H6.4L9.8 9.6Z"/><path d="M12 12.8v7.6"/></symbol>
<symbol id="ico-facture" viewBox="0 0 24 24"><title>Facture</title><path d="M4.6 2.8h14.8v18.4l-2.4-1.6-2.4 1.6-2.6-1.6-2.6 1.6-2.4-1.6-2.4 1.6Z"/><path d="M8 8h8M8 12h8M8 15.6h4.4"/></symbol>
<symbol id="ico-fichier" viewBox="0 0 24 24"><title>Fichier</title><path d="M13.4 2.8H7a2 2 0 0 0-2 2v14.4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.4Z"/><path d="M13.4 2.8v5.6H19"/></symbol>
<symbol id="ico-groupe" viewBox="0 0 24 24"><title>Groupe de trois</title><circle cx="12" cy="7" r="3.2"/><path d="M7.6 19.8a4.4 4.4 0 0 1 8.8 0Z"/><circle cx="4.6" cy="10" r="2.6"/><path d="M1.4 19.8v-2a3.2 3.2 0 0 1 4.6-2.9"/><circle cx="19.4" cy="10" r="2.6"/><path d="M22.6 19.8v-2a3.2 3.2 0 0 0-4.6-2.9"/></symbol>
<symbol id="ico-imprimante" viewBox="0 0 24 24"><title>Imprimante</title><path d="M7 8.6V3.4h10v5.2"/><rect x="3.4" y="8.6" width="17.2" height="7.6" rx="2"/><rect x="7" y="14.4" width="10" height="6.2" rx="1.2"/></symbol>
<symbol id="ico-mail" viewBox="0 0 24 24"><title>Courriel</title><rect x="2.6" y="5" width="18.8" height="14" rx="2.2"/><path d="m2.6 7 9.4 6.4L21.4 7"/></symbol>
<symbol id="ico-minuteur" viewBox="0 0 24 24"><title>Minuteur</title><circle cx="12" cy="13.2" r="7.8"/><path d="M12 9v4.2l2.8 1.8"/><path d="M9.4 2.6h5.2"/></symbol>
<symbol id="ico-nuage" viewBox="0 0 24 24"><title>Nuage</title><path d="M7 18.4a4.6 4.6 0 0 1-.4-9.2 6 6 0 0 1 11.4 1.4 3.9 3.9 0 0 1-.6 7.8Z"/></symbol>
<symbol id="ico-tableur" viewBox="0 0 24 24"><title>Tableur</title><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.6h18"/><path d="M9 4v16M15 4v16"/></symbol>
<symbol id="ico-telephone" viewBox="0 0 24 24"><title>Téléphone</title><rect x="7" y="2.4" width="10" height="19.2" rx="2.2"/><path d="M12 18.6v.1"/></symbol>
</svg>
<!--ICONS:END-->

<div class="top">
  <div class="ttl">
    <div class="h1">Éditions, destinataires et délais, l'essentiel</div>
    <div class="sub">Trois onglets, douze points · la mini-fiche à relire avant de produire et d'envoyer un rapport</div>
  </div>
  <div class="top-right">
    <span class="mini-badge">
      <svg class="ico" aria-hidden="true"><use href="#ico-epingle"/></svg> L'essentiel
    </span>
    <div class="zoom-ctrl" role="group" aria-label="Zoom">
      <button class="zoom-btn" id="zoomOut" aria-label="Réduire" title="Réduire">−</button>
      <button class="zoom-val" id="zoomReset" aria-label="Réinitialiser le zoom" title="Réinitialiser">100%</button>
      <button class="zoom-btn" id="zoomIn" aria-label="Agrandir" title="Agrandir">+</button>
    </div>
  </div>
</div>

<div class="tabs" role="tablist" id="tabs"></div>
<div id="panels" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>

<script>
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
/* Gamification minimale imposée par le type 13 : un son doux, aucun score. */
const SNDS={doux:()=>tn(880,1100,.14,.03,0,'sine')};

const ONGLETS=[
{id:"editions",label:"Les éditions",ico:"ico-imprimante",
 keep:"Une édition se fige, se date et dit sa période ; seule celle de la clôture fait foi.",
 points:[
  {ico:"ico-fichier",ttl:"Les éditions du logiciel",txt:"Statistiques de la période, état des comptes débiteurs, journal des ventes : le poste les tire du menu des éditions, en choisissant la période, l'établissement et les filtres, puis les enregistre en PDF. Elles <strong>font foi</strong> parce qu'elles sortent sans retouche des données clôturées. Avant l'envoi, l'en-tête se relit : un filtre resté actif depuis l'édition précédente produit un document juste en apparence."},
  {ico:"ico-tableur",ttl:"Les rapports du support d'analyse",txt:"Flash, synthèse de la semaine et rapport mensuel naissent dans le classeur. Leur édition fige en PDF l'onglet de présentation, <strong>commentaires compris</strong>, une fois que toutes les cellules de contrôle affichent « OK ». Le classeur lui-même ne part qu'à qui poursuit le calcul, contrôleur de gestion ou siège, et jamais comme version de référence d'un rapport diffusé."},
  {ico:"ico-facture",ttl:"Les états destinés à l'extérieur",txt:"L'état joint au reversement de la <strong>taxe de séjour</strong> suit les dates fixées par délibération de la commune ou de l'intercommunalité. Le questionnaire mensuel de fréquentation de l'<strong>Insee</strong> concerne les établissements interrogés. Pour ces documents, un tiers impose son calendrier : le poste le reporte au calendrier des éditions, avec un responsable et un remplaçant."},
  {ico:"ico-dossier",ttl:"Les éditions à la demande",txt:"L'expert-comptable, le siège ou un contrôleur réclament une période passée ou un extrait du journal des ventes. Ces pièces portent la mention de <strong>réédition</strong>, pour ne pas passer pour l'original, partent avec <strong>copie à la direction</strong> et se notent avec leur date et leur destinataire. Une réédition reste possible tant que les données de clôture sont conservées."}]},

{id:"destinataires",label:"Les destinataires",ico:"ico-groupe",
 keep:"Le bon destinataire est celui de la liste, en poste et habilité, et lui seul.",
 points:[
  {ico:"ico-mail",ttl:"La liste de diffusion",txt:"Chaque rapport part à un <strong>ensemble nommé</strong> de destinataires, fixé par la direction. La liste se tient à jour à chaque arrivée et à chaque départ du personnel, de préférence par le poste qui gère ces mouvements, et la direction la relit chaque trimestre. Elle ne contient que des <strong>adresses professionnelles</strong> de personnes en poste et habilitées, jamais une messagerie personnelle."},
  {ico:"ico-fichier",ttl:"Le format selon l'usage",txt:"Le <strong>PDF</strong> va à la hiérarchie et à l'archive : il reste identique à ce qui a été lu. Le <strong>classeur</strong> va seulement à qui doit poursuivre le calcul. Le <strong>papier</strong>, imprimé à partir du PDF en nombre limité, sert la réunion où chacun annote le même document ; les exemplaires se récupèrent à la fin quand le rapport contient des données sensibles."},
  {ico:"ico-nuage",ttl:"Pièce jointe ou lien",txt:"La <strong>pièce jointe</strong> crée autant de copies que de destinataires, qui échappent ensuite à la maison. Le <strong>lien</strong> vers le dossier partagé garde une seule version, dont l'accès se contrôle et se retire, mais suppose des droits et une connexion au moment de la lecture. La maison tranche selon la sensibilité : flash interne souvent en pièce jointe, rapport mensuel détaillé plutôt par lien."},
  {ico:"ico-cadenas",ttl:"Les chiffres qui ne sortent pas",txt:"Taux d'occupation, prix moyen, conditions négociées, prévisions et incidents intéressent un concurrent. Le rapport porte la mention <strong>« confidentiel »</strong> en en-tête et ne part qu'aux adresses de la liste. Aucun chiffre ne se donne par téléphone à un interlocuteur non vérifié : un appel qui se dit du siège se rappelle sur le numéro du siège avant toute réponse."}]},

{id:"delais",label:"Les délais",ico:"ico-calendrier",
 keep:"Un rapport arrive avant la décision qu'il sert ; une anomalie, elle, n'attend aucun rapport.",
 points:[
  {ico:"ico-minuteur",ttl:"Le flash, avant la réunion du matin",txt:"Le flash et les éditions de clôture partent <strong>chaque matin</strong>, assez tôt pour que la direction les ait lus avant la réunion. Le délai se compte à partir de cette décision, et non du moment où le rapport est prêt. Arrivé après la réunion qu'il devait préparer, un flash pourtant juste n'a plus rien éclairé, et la journée s'est décidée sans lui."},
  {ico:"ico-calendrier",ttl:"La semaine et le mois",txt:"La synthèse de la semaine part <strong>chaque lundi</strong>, avant la réunion de direction. Les statistiques et l'état des débiteurs du mois clôturé se produisent le premier jour ouvré du mois, et le rapport mensuel parvient dans les jours fixés par le siège ou le propriétaire, souvent les <strong>cinq premiers jours ouvrés</strong>. La taxe de séjour suit les échéances de la collectivité."},
  {ico:"ico-alerte",ttl:"Le retard qui s'annonce",txt:"Un relevé manque, la clôture a échoué : le poste prévient ses destinataires <strong>avant l'échéance</strong>, pas après. Si la procédure le permet, il envoie une version marquée « provisoire » qui indique ce qui manque et quand suivra la définitive. Un retard annoncé laisse au lecteur le choix d'attendre ; un retard découvert lui fait perdre confiance dans toute la chaîne."},
  {ico:"ico-telephone",ttl:"L'alerte, sans attendre le rapport",txt:"Tarif erroné en vente, fraude suspectée, écart de caisse important, clôture impossible : l'anomalie se signale <strong>immédiatement</strong> au responsable désigné, de vive voix ou par téléphone, puis se confirme <strong>par écrit dans l'heure</strong>, pour être datée. Sans réponse, le poste suit la chaîne prévue, adjoint puis directeur, sans attendre le lendemain."}]}
];

const $=id=>document.getElementById(id);
let actif=0;

function peint(){
  $('tabs').innerHTML=ONGLETS.map((o,i)=>
    `<button class="tab${i===actif?' is-on':''}" role="tab" data-i="${i}"
       aria-selected="${i===actif}" aria-controls="p${o.id}">
      <svg class="ico" aria-hidden="true"><use href="#${o.ico}"/></svg>${o.label}
    </button>`).join('');
  $('panels').innerHTML=ONGLETS.map((o,i)=>
    `<section class="panel${i===actif?' is-on':''}" id="p${o.id}" role="tabpanel">
      <div class="grid">${o.points.map(p=>
        `<div class="point">
          <div class="pt-hd">
            <span class="pt-ico"><svg class="ico" aria-hidden="true"><use href="#${p.ico}"/></svg></span>
            <span class="pt-ttl">${p.ttl}</span>
          </div>
          <div class="pt-txt">${p.txt}</div>
        </div>`).join('')}</div>
      <div class="keep">
        <svg class="ico" aria-hidden="true"><use href="#ico-epingle"/></svg>
        <div><div class="keep-lbl">À retenir</div><div class="keep-txt">${o.keep}</div></div>
      </div>
    </section>`).join('');
  document.querySelectorAll('.tab').forEach(b=>{
    b.addEventListener('click',()=>{actif=+b.dataset.i;SNDS.doux();peint()});
    b.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        actif=(actif+(e.key==='ArrowRight'?1:ONGLETS.length-1))%ONGLETS.length;
        SNDS.doux();peint();
        document.querySelectorAll('.tab')[actif].focus();
      }});
  });
}

(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
  val.addEventListener('click',()=>{i=STEPS.indexOf(1);apply()});apply()})();

peint();SNDS.doux();
</script>
</body>
</html>
