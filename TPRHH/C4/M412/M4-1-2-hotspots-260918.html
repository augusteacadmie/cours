<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le compte client · Schéma interactif</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rf:999px;
  --e1:0 1px 3px rgba(0,0,0,.06);--e2:0 4px 16px rgba(0,0,0,.08);--e3:0 12px 32px -8px rgba(0,0,0,.22);
  --ink:#323232;--ink-body:#323232;--ink-soft:#6B6560;--line:rgba(0,0,0,.10);
  --surface:#FAFAFA;
  /* MATIÈRE — Jaune : tourisme, hébergement, réception, accueil (palettes-domaines.md §1) */
  --paper:#F2F3F5;--ac:#64748B;--on-ac:#FAFAFA;--ac-bg:#E1E5EA;--ac-bd:#7A899F;
  /* couleurs de la carte — le réel, saturation réduite (svg-illustration.md) */
  --z-centre:#E8DCC0;--z-peri:#DCD3C6;--z-campagne:#CBD9C3;
  --z-eau:#C3D4DE;--z-voie:#C9CDD2;--trait:#7A736A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
/* Racine reduite de 20 % (design-tokens.md §1) : le reglage precedent
   (17-22px) poussait le contenu hors de l'ecran sur les formats moyens.
   Corps de texte effectif : 13 a 17,5px. Aucun token individuel retouche. */
html{font-size:calc(clamp(13.5px, 0.84vw + 8px, 17.5px) * var(--z, 1))}
body{background:var(--paper);padding:var(--s5);
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;color:var(--ink-body)}
@media (min-width:881px){
  html,body{height:100%;min-height:0;overflow:hidden}
  body{padding:var(--s7);padding-bottom:var(--s7)}
}
html.zoomed,html.zoomed body{height:auto;min-height:100%;overflow:auto}

.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  margin-bottom:var(--s5);flex-wrap:wrap}
.h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:var(--s1);
  letter-spacing:-.01em;line-height:1.2}
.sub{font-size:0.85rem;font-weight:500;color:var(--ink-soft)}
.top-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:3px;flex-shrink:0}
.zoom-btn,.zoom-val{font-family:inherit;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);font-weight:800;transition:background .15s;border-radius:var(--r1)}
.zoom-btn{width:1.6rem;height:1.6rem;font-size:0.95rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.zoom-btn:hover,.zoom-val:hover{background:var(--ac-bg);color:var(--ink)}
.zoom-val{min-width:2.6rem;height:1.6rem;font-size:0.68rem;letter-spacing:.02em}

.legend{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s4)}
.leg{display:inline-flex;align-items:center;gap:var(--s2);font-size:0.68rem;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.leg-sw{width:0.85rem;height:0.85rem;border-radius:3px;border:1.5px solid var(--trait)}

.stage{flex:1;display:flex;gap:var(--s5);min-height:0}
@media (max-width:880px){.stage{flex-direction:column}}

.plan-wrap{flex:1.35;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r4);padding:var(--s4);min-height:0;display:flex}
.plan{width:100%;height:100%;display:block;min-height:15rem}

.anneau{stroke:var(--trait);stroke-width:1.6;stroke-dasharray:7 5}
.champ{fill:#FAFAFA;stroke:var(--trait);stroke-width:1.4}
.voie{stroke:var(--z-voie);stroke-width:9;fill:none;stroke-linecap:round}
.voie-bord{stroke:var(--trait);stroke-width:1.2;fill:none;stroke-dasharray:3 6}
.bati{fill:var(--z-centre);stroke:var(--trait);stroke-width:1.6}
.lbl{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;
  fill:#323232;text-anchor:middle;pointer-events:none}
.lbl.soft{font-weight:600;fill:#6B6560}

.hs{cursor:pointer}
.hs-halo{fill:var(--ac);opacity:.2;transition:opacity .18s}
.hs-dot{fill:var(--ac);stroke:#FAFAFA;stroke-width:3;transition:r .18s}
.hs-num{fill:#323232;font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;
  text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hs:hover .hs-dot,.hs:focus-visible .hs-dot{r:23}
.hs:hover .hs-halo{opacity:.34}
.hs:focus-visible{outline:none}
.hs:focus-visible .hs-halo{opacity:.45}
.hs.active .hs-halo{opacity:.42}
.hs.visited .hs-dot{stroke:var(--trait)}
.hs.pulse .hs-halo{animation:hspulse 2.2s ease infinite}

.panel{flex:1;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r4);padding:var(--s6);display:flex;flex-direction:column;
  gap:var(--s4);min-height:0;min-width:0}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s3);text-align:center;
  border:2px dashed var(--ac-bd);border-radius:var(--r3);padding:var(--s6)}
.welcome-ico{color:var(--ink-soft)}
.welcome-ico .ico{width:2.8rem;height:2.8rem;stroke-width:1.5}
.welcome-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.welcome-t{font-size:0.9rem;font-weight:500;color:var(--ink-soft);line-height:1.6;max-width:24rem}
.welcome-cta{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-ac);background:var(--ac);padding:var(--s1) var(--s3);border-radius:var(--r1)}

.p-tag{display:inline-flex;align-items:center;gap:var(--s1);align-self:flex-start;
  padding:3px var(--s3);border-radius:var(--rf);background:var(--ac);color:var(--on-ac);
  font-size:0.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.p-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.25;letter-spacing:-.01em}
.p-body{font-size:0.95rem;font-weight:500;color:var(--ink-body);line-height:1.6}
.p-body strong{font-weight:700;color:var(--ink)}
.p-rows{display:flex;flex-direction:column;gap:var(--s2)}
.p-row{display:flex;gap:var(--s3);align-items:baseline;padding-bottom:var(--s2);
  border-bottom:1.5px solid var(--line)}
.p-row:last-child{border-bottom:none;padding-bottom:0}
.p-row-l{font-size:0.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);min-width:6.5rem;flex-shrink:0}
.p-row-v{font-size:0.85rem;font-weight:600;color:var(--ink);line-height:1.5}
.vigilance{padding:var(--s4) var(--s5);border-radius:var(--r3);font-size:0.9rem;
  font-weight:500;line-height:1.6;border-left:3px solid var(--ac);background:var(--ac-bg);
  color:var(--ink)}
.scroll-zone{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ac-bd) transparent}
.scroll-zone::-webkit-scrollbar{width:4px}
.scroll-zone::-webkit-scrollbar-track{background:transparent}
.scroll-zone::-webkit-scrollbar-thumb{background:var(--ac-bd);border-radius:2px}

.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  margin-top:var(--s4);flex-wrap:wrap}
.nbtn{font-family:inherit;font-size:0.8rem;font-weight:700;padding:var(--s3) var(--s5);
  min-height:48px;border-radius:var(--r2);border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:background .18s;
  display:inline-flex;align-items:center;gap:var(--s2)}
.nbtn:hover:not(:disabled){background:var(--ac-bg)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.primary{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.nbtn.primary:hover:not(:disabled){background:var(--ac-bd)}
.nav-prog{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--ac-bd);opacity:.4}
.dot.seen{opacity:1}
.dot.now{opacity:1;background:var(--ac);outline:2px solid var(--trait);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes hspulse{0%,100%{opacity:.2}50%{opacity:.04}}
.panel > *{animation:fadeUp .3s both}
</style>
</head>
<body>
<!--ICONS:START-->
<svg style="display:none" aria-hidden="true">
<symbol id="ico-ecran" viewBox="0 0 24 24"><title>Écran</title><rect x="2.8" y="3.6" width="18.4" height="12.8" rx="2"/><path d="M12 16.4v4M8.4 20.4h7.2"/></symbol>
<symbol id="ico-fleche-droite" viewBox="0 0 24 24"><title>Flèche droite</title><path d="M3.5 12h17"/><path d="M14 5.5 20.5 12 14 18.5"/></symbol>
<symbol id="ico-fleche-gauche" viewBox="0 0 24 24"><title>Flèche gauche</title><path d="M20.5 12h-17"/><path d="M10 5.5 3.5 12 10 18.5"/></symbol>
</svg>
<!--ICONS:END-->

<div class="top">
  <div class="ttl">
    <div class="h1">Le compte client, bloc par bloc</div>
    <div class="sub">Huit blocs d'un compte en cours · cliquez un bloc pour savoir ce qu'il prouve</div>
  </div>
  <div class="top-right">
    <div class="zoom-ctrl" role="group" aria-label="Zoom">
      <button class="zoom-btn" id="zoomOut" aria-label="Réduire" title="Réduire">−</button>
      <button class="zoom-val" id="zoomReset" aria-label="Réinitialiser le zoom" title="Réinitialiser">100%</button>
      <button class="zoom-btn" id="zoomIn" aria-label="Agrandir" title="Agrandir">+</button>
    </div>
  </div>
</div>

<div class="legend" aria-label="Légende de la carte">
  <span class="leg"><span class="leg-sw" style="background:var(--z-centre)"></span>L'écran du dossier</span>
  <span class="leg"><span class="leg-sw" style="background:#FAFAFA"></span>Les blocs à contrôler</span>
  
  
</div>

<div class="stage">
  <div class="plan-wrap">
    <svg class="plan" viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Compte client à l'écran, huit blocs numérotés">

      <!-- la page éditée -->
      <rect class="bati" x="20" y="20" width="600" height="430" rx="10"/>
      <rect class="bati" x="20" y="20" width="600" height="36" rx="10"/>
      <text class="lbl soft" x="320" y="44">Compte client · dossier en cours</text>

      <rect class="champ" x="40" y="80" width="270" height="150" rx="5"/>
      <text class="lbl" x="175" y="160">Lignes de prestations</text>
      <g class="hs pulse" data-id="2" tabindex="0" role="button" aria-label="Les lignes de prestations">
        <circle class="hs-halo" cx="288" cy="102" r="26"/><circle class="hs-dot" cx="288" cy="102" r="20"/>
        <text class="hs-num" x="288" y="102">2</text></g>

      <rect class="champ" x="40" y="245" width="270" height="90" rx="5"/>
      <text class="lbl" x="175" y="296">Transferts</text>
      <g class="hs pulse" data-id="4" tabindex="0" role="button" aria-label="Les transferts entre comptes">
        <circle class="hs-halo" cx="288" cy="267" r="26"/><circle class="hs-dot" cx="288" cy="267" r="20"/>
        <text class="hs-num" x="288" y="267">4</text></g>

      <rect class="champ" x="40" y="350" width="270" height="90" rx="5"/>
      <text class="lbl" x="175" y="401">Journal des opérations</text>
      <g class="hs pulse" data-id="6" tabindex="0" role="button" aria-label="Le journal des opérations">
        <circle class="hs-halo" cx="288" cy="372" r="26"/><circle class="hs-dot" cx="288" cy="372" r="20"/>
        <text class="hs-num" x="288" y="372">6</text></g>

      <rect class="champ" x="330" y="80" width="270" height="90" rx="5"/>
      <text class="lbl" x="465" y="131">En-tête du dossier</text>
      <g class="hs pulse" data-id="1" tabindex="0" role="button" aria-label="L'en-tête du dossier">
        <circle class="hs-halo" cx="578" cy="102" r="26"/><circle class="hs-dot" cx="578" cy="102" r="20"/>
        <text class="hs-num" x="578" y="102">1</text></g>

      <rect class="champ" x="330" y="185" width="270" height="90" rx="5"/>
      <text class="lbl" x="465" y="236">Ventilation par payeur</text>
      <g class="hs pulse" data-id="3" tabindex="0" role="button" aria-label="La ventilation par payeur">
        <circle class="hs-halo" cx="578" cy="207" r="26"/><circle class="hs-dot" cx="578" cy="207" r="20"/>
        <text class="hs-num" x="578" y="207">3</text></g>

      <rect class="champ" x="330" y="290" width="130" height="70" rx="5"/>
      <text class="lbl" x="395" y="331">Pièces</text>
      <g class="hs pulse" data-id="5" tabindex="0" role="button" aria-label="Les pièces rattachées">
        <circle class="hs-halo" cx="436" cy="312" r="26"/><circle class="hs-dot" cx="436" cy="312" r="20"/>
        <text class="hs-num" x="436" y="312">5</text></g>

      <rect class="champ" x="470" y="290" width="130" height="70" rx="5"/>
      <text class="lbl" x="535" y="331">Solde</text>
      <g class="hs pulse" data-id="7" tabindex="0" role="button" aria-label="Le solde et les règlements">
        <circle class="hs-halo" cx="578" cy="312" r="26"/><circle class="hs-dot" cx="578" cy="312" r="20"/>
        <text class="hs-num" x="578" y="312">7</text></g>

      <rect class="champ" x="330" y="375" width="270" height="65" rx="5"/>
      <text class="lbl" x="465" y="413">Statut du compte</text>
      <g class="hs pulse" data-id="8" tabindex="0" role="button" aria-label="Le statut du compte">
        <circle class="hs-halo" cx="578" cy="397" r="26"/><circle class="hs-dot" cx="578" cy="397" r="20"/>

    </svg>
  </div>

  <div class="panel scroll-zone" id="panel"></div>
</div>

<div class="nav-bar">
  <button class="nbtn" id="prev">
    <svg class="ico" aria-hidden="true"><use href="#ico-fleche-gauche"/></svg> Précédent
  </button>
  <div class="nav-prog" id="prog" aria-label="Repères parcourus"></div>
  <button class="nbtn primary" id="next">
    Suivant <svg class="ico" aria-hidden="true"><use href="#ico-fleche-droite"/></svg>
  </button>
</div>

<script>
/* ---------- SON ---------- */
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
/* un son distinct par repère : la note monte avec l'éloignement */
const NOTES=[392,440,494,523,587,659,698,784,880,988];
const SNDS={
  hover:()=>tn(1000,1200,.06,.03,0,'triangle'),
  repere:i=>{const f=NOTES[i%NOTES.length];tn(f,f,.2,.05,0,'triangle');tn(f*1.5,f*1.5,.16,.03,.05,'sine')},
  tour:()=>{ns(2400,.02,.12,0);tn(1318,1318,.4,.04,0,'sine')}
};

/* ---------- DONNÉES ---------- */
const REPERES=[
{id:1,tag:"Ce qui identifie",titre:"L'en-tête du dossier",
 body:"L'en-tête porte le nom, les dates d'arrivée et de départ, l'unité occupée, le tarif d'application et le <strong>payeur désigné</strong>. Rien de tout cela n'est un montant, et pourtant c'est ce bloc qui décide où chaque ligne ira se poser pendant tout le séjour.",
 rows:[["Ce qu'on lit","Le nom, les dates, l'unité, le tarif d'application et le payeur désigné"],
       ["Ce que cela commande","Le compte sur lequel chaque prestation viendra se poser jusqu'au départ"],
       ["L'erreur classique","Un payeur laissé par défaut alors qu'une société règle l'hébergement seul"]],
 rule:"Une adresse fausse ou un tiers payeur absent ne se voit pas au contrôle des lignes : cela se voit au moment de facturer, quand il est trop tard pour demander."},

{id:2,tag:"Ce qui se rapproche",titre:"Les lignes de prestations",
 body:"Le corps du compte : une ligne par prestation, avec sa date, son point de vente, son libellé et son montant. C'est ici que se fait le rapprochement, ligne à ligne, contre les pièces produites ailleurs — et jamais en lisant les montants les uns après les autres.",
 rows:[["Ce qu'on rapproche","Chaque ligne contre la pièce qui l'a produite, par journée, unité et montant"],
       ["Ce que le total cache","Deux imputations croisées, qui laissent le total juste et deux comptes faux"],
       ["Le sens à lire d'abord","Comptes au-dessus des pièces, une ligne est de trop ; en dessous, une ligne manque"]],
 rule:"Une ligne sans contrepartie n'est pas une ligne fausse : c'est une ligne non vérifiée. La distinction décide de la suite, puisqu'on cherche avant de corriger."},

{id:3,tag:"Ce qui se répartit",titre:"La ventilation par payeur",
 body:"Un séjour se règle rarement d'un seul bloc. La ventilation dit ce qui part au compte société, ce qui reste à la charge du client, ce qui s'impute sur un bon d'agence. Elle se pose au dossier, et chaque ligne suit ensuite la règle posée sans qu'on ait à y penser.",
 rows:[["Ce qu'on vérifie","Que la règle posée au dossier correspond au contrat ou au bon transmis"],
       ["Ce qu'elle révèle","Un extra parti au compte société alors qu'il reste à la charge du client"],
       ["Où elle resservira","À la facturation du départ, qui éditera autant de pièces que de payeurs"]],
 rule:"Une ventilation juste ne rend pas les lignes justes : elle les range. Un compte peut être parfaitement ventilé et porter une prestation que personne n'a servie."},

{id:4,tag:"Ce qui ne fait entrer aucun argent",titre:"Les transferts entre comptes",
 body:"Lignes déplacées d'un compte vers un autre, lignes annulées, lignes reprises. Aucune de ces opérations ne fait entrer ni sortir d'argent de la maison : elles n'apparaissent dans aucun total de point de vente, ce qui les rend invisibles à qui ne les cherche pas.",
 rows:[["Transférer","Déplacer une ligne d'un compte vers un autre : deux comptes changent, pas le total"],
       ["Annuler","Retirer une ligne portée par erreur : le compte change, le point de vente non"],
       ["Pourquoi les lire","Un transfert de trop explique un compte dont aucune pièce ne rend compte"]],
 rule:"C'est le seul bloc du compte dont le contrôle ne passe par aucun montant global. Il se lit, il ne s'additionne pas — et c'est pour cela qu'on l'oublie."},

{id:5,tag:"Ce qui prouve",titre:"Les pièces rattachées",
 body:"Tickets signés, relevés de point de vente, consignes écrites du poste, bons d'agence : les pièces ne sont pas dans le compte, elles sont à côté. Le rattachement est ce qui transforme une ligne en ligne vérifiée, et une ligne étrange en ligne autorisée.",
 rows:[["Ce qu'on rattache","Le ticket à sa ligne, la consigne à ce qu'elle couvre, le bon à sa ventilation"],
       ["Ce qui n'a pas de pièce","Une ligne à chercher, jamais une ligne à retirer sans avoir cherché"],
       ["La pièce qu'on oublie","La consigne du poste de nuit, qui explique une bonne part des montants hors tarif"]],
 rule:"Une pièce dit une chose et une seule. Le ticket dit qu'un service a été rendu, la consigne dit qu'une décision a été prise, et aucun des deux ne dit ce que dit l'autre."},

{id:6,tag:"Ce qui garde la trace",titre:"Le journal des opérations",
 body:"La liste chronologique de tout ce qui a touché le compte : saisies, modifications, annulations, avec l'heure et l'opérateur. C'est la pièce qu'on ouvre quand deux lignes se ressemblent trop, et celle qui distingue un doublon d'une consommation réellement prise deux fois.",
 rows:[["Ce qu'on y cherche","Une modification glissée entre deux lignes identiques, à quelques minutes d'écart"],
       ["Ce qu'il permet","Savoir qui a corrigé quoi, et si la correction a été menée jusqu'au bout"],
       ["Ce qu'il ne fait pas","Expliquer : trois opérations sur la même ligne n'en justifient aucune des trois"]],
 rule:"Le journal enregistre tout et n'explique rien. C'est la trace écrite par le poste — ce qui a changé, ce qui remplace, la raison, l'auteur — qui rend un compte défendable."},

 body:"Les sommes déjà portées au compte en règlement : acompte, arrhes, règlement partiel, et le solde qui reste dû. Le montant total est rarement en cause ; c'est le mode porté à chaque règlement qui se contrôle, contre le journal du terminal et le bordereau de remise.",
 rows:[["Ce qu'on vérifie","Que le mode annoncé au compte correspond à la pièce d'encaissement du jour"],
       ["Ce qui ne se voit pas","Une somme bien entrée et mal ventilée : le client n'en saura jamais rien"],
       ["Où cela ressortira","Au rapport de caisse, puis à la remise en banque, qui ne concordera pas"]],

/* ---------- RENDU ---------- */
const $=id=>document.getElementById(id);
let courant=null;
const vus=new Set();

function welcome(){
  $('panel').innerHTML=`
  <div class="welcome">
    <div class="welcome-ico"><svg class="ico" aria-hidden="true"><use href="#ico-ecran"/></svg></div>
    <div class="welcome-h">Un compte, huit blocs à lire</div>
    <div class="welcome-t">Cet écran n'est celui d'aucun logiciel en particulier : c'est ce que tout compte client affiche, sous des noms qui changent d'une maison à l'autre. Huit blocs, et pour chacun ce qu'il prouve — ce qui identifie, ce qui se rapproche, ce qui se répartit, ce qui ne fait entrer aucun argent, et celui qui décide de la manière de corriger.</div>
    <div class="welcome-cta">Ouvrez un bloc pour savoir ce qu'il prouve</div>
  </div>`;
}

function rendRepere(id){
  const r=REPERES.find(x=>x.id===id);
  courant=id;vus.add(id);
  $('panel').innerHTML=`
    <span class="p-tag">${r.tag}</span>
    <div class="p-h">${r.id}. ${r.titre}</div>
    <div class="p-body">${r.body}</div>
    <div class="p-rows">${r.rows.map(([l,v])=>
      `<div class="p-row"><span class="p-row-l">${l}</span><span class="p-row-v">${v}</span></div>`).join('')}</div>
    <div class="vigilance">${r.rule}</div>`;
  document.querySelectorAll('.hs').forEach(g=>{
    const i=+g.dataset.id;
    g.classList.toggle('active',i===id);
    g.classList.toggle('visited',vus.has(i));
    g.classList.toggle('pulse',!vus.has(i));
  });
  majProg();
  if(window.matchMedia('(max-width:880px)').matches){
    $('panel').scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function majProg(){
  $('prog').innerHTML=REPERES.map(r=>{
    let c='dot';
    if(r.id===courant)c+=' now';else if(vus.has(r.id))c+=' seen';
    return `<span class="${c}"></span>`;
  }).join('');
}

document.querySelectorAll('.hs').forEach(g=>{
  const id=+g.dataset.id;
  g.addEventListener('mouseenter',()=>SNDS.hover());
  const ouvre=()=>{SNDS.repere(id-1);rendRepere(id)};
  g.addEventListener('click',ouvre);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ouvre()}});
});
$('prev').addEventListener('click',()=>{
  const i=courant?REPERES.findIndex(r=>r.id===courant):0;
  const j=(i-1+REPERES.length)%REPERES.length;
  SNDS.repere(j);rendRepere(REPERES[j].id);
});
$('next').addEventListener('click',()=>{
  const i=courant?REPERES.findIndex(r=>r.id===courant):-1;
  const j=(i+1)%REPERES.length;
  SNDS.repere(j);rendRepere(REPERES[j].id);
});

/* ---------- ZOOM ---------- */
(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];
  let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
  val.addEventListener('click',()=>{i=STEPS.indexOf(1);apply()});
  apply();
})();

welcome();majProg();SNDS.tour();
</script>
