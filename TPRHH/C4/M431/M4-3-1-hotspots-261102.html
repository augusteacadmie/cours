<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La feuille de situation · Schéma interactif</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rf:999px;
  --e1:0 1px 3px rgba(0,0,0,.06);--e2:0 4px 16px rgba(0,0,0,.08);--e3:0 12px 32px -8px rgba(0,0,0,.22);
  --ink:#323232;--ink-body:#323232;--ink-soft:#6B6560;--line:rgba(0,0,0,.10);
  --surface:#FAFAFA;
  /* MATIÈRE — Jaune : tourisme, hébergement, réception, accueil (palettes-domaines.md §1) */
  --paper:#F2F3F5;--ac:#64748B;--on-ac:#FAFAFA;--ac-bg:#E1E5EA;--ac-bd:#7A899F;
  /* couleurs de la carte — le réel, saturation réduite (svg-illustration.md) */
  --z-centre:#E8DCC0;--z-peri:#DCD3C6;--z-campagne:#CBD9C3;
  --z-eau:#C3D4DE;--z-voie:#C9CDD2;--trait:#7A736A;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
/* Racine reduite de 20 % (design-tokens.md §1) : le reglage precedent
   (17-22px) poussait le contenu hors de l'ecran sur les formats moyens.
   Corps de texte effectif : 13 a 17,5px. Aucun token individuel retouche. */
html{font-size:calc(clamp(13.5px, 0.84vw + 8px, 17.5px) * var(--z, 1))}
body{background:var(--paper);padding:var(--s5);
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;color:var(--ink-body)}
@media (min-width:881px){
  html,body{height:100%;min-height:0;overflow:hidden}
  body{padding:var(--s7);padding-bottom:var(--s7)}
}
html.zoomed,html.zoomed body{height:auto;min-height:100%;overflow:auto}

.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  margin-bottom:var(--s5);flex-wrap:wrap}
.h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:var(--s1);
  letter-spacing:-.01em;line-height:1.2}
.sub{font-size:0.85rem;font-weight:500;color:var(--ink-soft)}
.top-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:3px;flex-shrink:0}
.zoom-btn,.zoom-val{font-family:inherit;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);font-weight:800;transition:background .15s;border-radius:var(--r1)}
.zoom-btn{width:1.6rem;height:1.6rem;font-size:0.95rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.zoom-btn:hover,.zoom-val:hover{background:var(--ac-bg);color:var(--ink)}
.zoom-val{min-width:2.6rem;height:1.6rem;font-size:0.68rem;letter-spacing:.02em}

.legend{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;margin-bottom:var(--s4)}
.leg{display:inline-flex;align-items:center;gap:var(--s2);font-size:0.68rem;
  font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.leg-sw{width:0.85rem;height:0.85rem;border-radius:3px;border:1.5px solid var(--trait)}

.stage{flex:1;display:flex;gap:var(--s5);min-height:0}
@media (max-width:880px){.stage{flex-direction:column}}

.plan-wrap{flex:1.35;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r4);padding:var(--s4);min-height:0;display:flex}
.plan{width:100%;height:100%;display:block;min-height:15rem}

.anneau{stroke:var(--trait);stroke-width:1.6;stroke-dasharray:7 5}
.champ{fill:#FAFAFA;stroke:var(--trait);stroke-width:1.4}
.voie{stroke:var(--z-voie);stroke-width:9;fill:none;stroke-linecap:round}
.voie-bord{stroke:var(--trait);stroke-width:1.2;fill:none;stroke-dasharray:3 6}
.bati{fill:var(--z-centre);stroke:var(--trait);stroke-width:1.6}
.lbl{font-family:'Montserrat',sans-serif;font-weight:700;font-size:15px;
  fill:#323232;text-anchor:middle;pointer-events:none}
.lbl.soft{font-weight:600;fill:#6B6560}
.mini{font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;
  fill:#323232;pointer-events:none}
.mini.b{font-weight:800}
.mini.r{text-anchor:end}
.mini.mid{text-anchor:middle;fill:#6B6560}

.hs{cursor:pointer}
.hs-halo{fill:var(--ac);opacity:.2;transition:opacity .18s}
.hs-dot{fill:var(--ac);stroke:#FAFAFA;stroke-width:3;transition:r .18s}
.hs-num{fill:#323232;font-family:'Montserrat',sans-serif;font-weight:800;font-size:19px;
  text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hs:hover .hs-dot,.hs:focus-visible .hs-dot{r:23}
.hs:hover .hs-halo{opacity:.34}
.hs:focus-visible{outline:none}
.hs:focus-visible .hs-halo{opacity:.45}
.hs.active .hs-halo{opacity:.42}
.hs.visited .hs-dot{stroke:var(--trait)}
.hs.pulse .hs-halo{animation:hspulse 2.2s ease infinite}

.panel{flex:1;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r4);padding:var(--s6);display:flex;flex-direction:column;
  gap:var(--s4);min-height:0;min-width:0}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s3);text-align:center;
  border:2px dashed var(--ac-bd);border-radius:var(--r3);padding:var(--s6)}
.welcome-ico{color:var(--ink-soft)}
.welcome-ico .ico{width:2.8rem;height:2.8rem;stroke-width:1.5}
.welcome-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.welcome-t{font-size:0.9rem;font-weight:500;color:var(--ink-soft);line-height:1.6;max-width:24rem}
.welcome-cta{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-ac);background:var(--ac);padding:var(--s1) var(--s3);border-radius:var(--r1)}

.p-tag{display:inline-flex;align-items:center;gap:var(--s1);align-self:flex-start;
  padding:3px var(--s3);border-radius:var(--rf);background:var(--ac);color:var(--on-ac);
  font-size:0.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.p-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.25;letter-spacing:-.01em}
.p-body{font-size:0.95rem;font-weight:500;color:var(--ink-body);line-height:1.6}
.p-body strong{font-weight:700;color:var(--ink)}
.p-rows{display:flex;flex-direction:column;gap:var(--s2)}
.p-row{display:flex;gap:var(--s3);align-items:baseline;padding-bottom:var(--s2);
  border-bottom:1.5px solid var(--line)}
.p-row:last-child{border-bottom:none;padding-bottom:0}
.p-row-l{font-size:0.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);min-width:6.5rem;flex-shrink:0}
.p-row-v{font-size:0.85rem;font-weight:600;color:var(--ink);line-height:1.5}
.vigilance{padding:var(--s4) var(--s5);border-radius:var(--r3);font-size:0.9rem;
  font-weight:500;line-height:1.6;border-left:3px solid var(--ac);background:var(--ac-bg);
  color:var(--ink)}
.scroll-zone{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ac-bd) transparent}
.scroll-zone::-webkit-scrollbar{width:4px}
.scroll-zone::-webkit-scrollbar-track{background:transparent}
.scroll-zone::-webkit-scrollbar-thumb{background:var(--ac-bd);border-radius:2px}

.nav-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  margin-top:var(--s4);flex-wrap:wrap}
.nbtn{font-family:inherit;font-size:0.8rem;font-weight:700;padding:var(--s3) var(--s5);
  min-height:48px;border-radius:var(--r2);border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:background .18s;
  display:inline-flex;align-items:center;gap:var(--s2)}
.nbtn:hover:not(:disabled){background:var(--ac-bg)}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn.primary{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.nbtn.primary:hover:not(:disabled){background:var(--ac-bd)}
.nav-prog{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--ac-bd);opacity:.4}
.dot.seen{opacity:1}
.dot.now{opacity:1;background:var(--ac);outline:2px solid var(--trait);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes hspulse{0%,100%{opacity:.2}50%{opacity:.04}}
.panel > *{animation:fadeUp .3s both}
</style>
</head>

<script>
/* ---------- SON ---------- */
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
/* un son distinct par repère : la note monte avec l'éloignement */
const NOTES=[392,440,494,523,587,659,698,784,880,988];
const SNDS={
  hover:()=>tn(1000,1200,.06,.03,0,'triangle'),
  repere:i=>{const f=NOTES[i%NOTES.length];tn(f,f,.2,.05,0,'triangle');tn(f*1.5,f*1.5,.16,.03,.05,'sine')},
  tour:()=>{ns(2400,.02,.12,0);tn(1318,1318,.4,.04,0,'sine')}
};

/* ---------- DONNÉES ---------- */
const REPERES=[
{id:1,tag:"Ce qui date",titre:"L'en-tête",
 body:"L'établissement, la <strong>date de la journée close</strong>, l'heure d'édition et souvent l'utilisateur qui a lancé la clôture. Une feuille lue le matin porte en règle générale la date de la veille. C'est la première chose à vérifier, avant le moindre chiffre.",
 rows:[["Ce qu'on lit","Journée du mardi 14 octobre, éditée le 15 à 6 h 52"],
       ["Ce qu'on vérifie","La date est celle de la journée close, et l'édition suit la clôture"],
       ["L'erreur classique","Une feuille datée du jour en cours, éditée avant la clôture, aux chiffres provisoires"]],
 rule:"Le planning montre le parc à l'instant ; la feuille fige une journée close, celle qui ne bougera plus. Une feuille provisoire n'a pas cette qualité."},

{id:2,tag:"Ce qui situe",titre:"Les colonnes jour, cumul et N-1",
 body:"Chaque ligne se lit sur trois colonnes qui ne mesurent pas la même période : la <strong>journée</strong>, sensible à un groupe ou à une panne ; le <strong>cumul du mois</strong>, recalculé sur les sommes ; la <strong>période de référence</strong>, l'an passé ou le budget.",
 rows:[["Jour","79,7 % : un seul jour ne fait pas une tendance"],

/* ---------- RENDU ---------- */
const $=id=>document.getElementById(id);
let courant=null;
const vus=new Set();

function welcome(){
  $('panel').innerHTML=`
  <div class="welcome">
    <div class="welcome-ico"><svg class="ico" aria-hidden="true"><use href="#ico-fichier"/></svg></div>
    <div class="welcome-h">Une feuille, neuf zones à lire</div>
    <div class="welcome-t">Cette feuille n'est celle d'aucun logiciel en particulier : rapport du directeur, état de situation ou manager's report, tous portent ces zones sous des noms qui changent d'une maison à l'autre. Neuf zones, et pour chacune ce qu'elle compte — la date, le parc, ce qui en sort, ce qui rapporte, ce qui bouge, qui a dormi, ce qui a été vendu, et les indicateurs qui se lisent en dernier.</div>
    <div class="welcome-cta">Ouvrez une zone pour savoir ce qu'elle compte</div>
  </div>`;
}

function rendRepere(id){
  const r=REPERES.find(x=>x.id===id);
  courant=id;vus.add(id);
  $('panel').innerHTML=`
    <span class="p-tag">${r.tag}</span>
    <div class="p-h">${r.id}. ${r.titre}</div>
    <div class="p-body">${r.body}</div>
    <div class="p-rows">${r.rows.map(([l,v])=>
      `<div class="p-row"><span class="p-row-l">${l}</span><span class="p-row-v">${v}</span></div>`).join('')}</div>
    <div class="vigilance">${r.rule}</div>`;
  document.querySelectorAll('.hs').forEach(g=>{
    const i=+g.dataset.id;
    g.classList.toggle('active',i===id);
    g.classList.toggle('visited',vus.has(i));
    g.classList.toggle('pulse',!vus.has(i));
  });
  majProg();
  if(window.matchMedia('(max-width:880px)').matches){
    $('panel').scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function majProg(){
  $('prog').innerHTML=REPERES.map(r=>{
    let c='dot';
    if(r.id===courant)c+=' now';else if(vus.has(r.id))c+=' seen';
    return `<span class="${c}"></span>`;
  }).join('');
}

document.querySelectorAll('.hs').forEach(g=>{
  const id=+g.dataset.id;
  g.addEventListener('mouseenter',()=>SNDS.hover());
  const ouvre=()=>{SNDS.repere(id-1);rendRepere(id)};
  g.addEventListener('click',ouvre);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ouvre()}});
});
$('prev').addEventListener('click',()=>{
  const i=courant?REPERES.findIndex(r=>r.id===courant):0;
  const j=(i-1+REPERES.length)%REPERES.length;
  SNDS.repere(j);rendRepere(REPERES[j].id);
});
$('next').addEventListener('click',()=>{
  const i=courant?REPERES.findIndex(r=>r.id===courant):-1;
  const j=(i+1)%REPERES.length;
  SNDS.repere(j);rendRepere(REPERES[j].id);
});

/* ---------- ZOOM ---------- */
(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];
  let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
  val.addEventListener('click',()=>{i=STEPS.indexOf(1);apply()});
  apply();
})();

welcome();majProg();SNDS.tour();
</script>
