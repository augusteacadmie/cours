<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le back office de la réception · L'essentiel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rf:999px;
  --e1:0 1px 3px rgba(0,0,0,.06);--e2:0 4px 16px rgba(0,0,0,.08);--e3:0 12px 32px -8px rgba(0,0,0,.22);
  --ink:#323232;--ink-body:#323232;--ink-soft:#6B6560;--line:rgba(0,0,0,.10);
  --surface:#FAFAFA;
  --paper:#F2F3F5;--ac:#64748B;--on-ac:#FAFAFA;--ac-bg:#E1E5EA;--ac-bd:#7A899F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
/* Racine reduite de 20 % (design-tokens.md §1) : le reglage precedent
   (17-22px) poussait le contenu hors de l'ecran sur les formats moyens.
   Corps de texte effectif : 13 a 17,5px. Aucun token individuel retouche. */
html{font-size:calc(clamp(13.5px, 0.84vw + 8px, 17.5px) * var(--z, 1))}
body{background:var(--paper);padding:var(--s5);
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:var(--s4);color:var(--ink-body)}
@media (min-width:881px){
  html,body{height:100%;min-height:0;overflow:hidden}
  body{padding:var(--s7);padding-bottom:var(--s7)}
}
html.zoomed,html.zoomed body{height:auto;min-height:100%;overflow:auto}
.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  flex-wrap:wrap}
.h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:var(--s1);
  letter-spacing:-.01em;line-height:1.2}
.sub{font-size:0.85rem;font-weight:500;color:var(--ink-soft)}
.top-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.mini-badge{display:inline-flex;align-items:center;gap:var(--s2);
  background:var(--ac);color:var(--on-ac);border-radius:var(--rf);
  padding:var(--s2) var(--s4);font-size:0.68rem;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase}
.zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:3px;flex-shrink:0}
.zoom-btn,.zoom-val{font-family:inherit;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);font-weight:800;transition:background .15s;border-radius:var(--r1)}
.zoom-btn{width:1.6rem;height:1.6rem;font-size:0.95rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.zoom-btn:hover,.zoom-val:hover{background:var(--ac-bg);color:var(--ink)}
.zoom-val{min-width:2.6rem;height:1.6rem;font-size:0.68rem;letter-spacing:.02em}

.tabs{display:flex;gap:var(--s2);flex-wrap:wrap}
.tab{font-family:inherit;font-size:0.95rem;font-weight:700;padding:var(--s3) var(--s6);
  min-height:48px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  color:var(--ink);border-radius:var(--r2);transition:background .15s,border-color .15s;
  display:inline-flex;align-items:center;gap:var(--s2)}
.tab:hover{background:var(--ac-bg)}
.tab.is-on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.panel{display:none;flex:1;flex-direction:column;gap:var(--s4);min-height:0}
.panel.is-on{display:flex;animation:fadeUp .3s both}
.grid{flex:1;display:grid;gap:var(--s4);grid-template-columns:repeat(2,1fr);
  align-content:stretch;min-height:0}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.point{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r4);
  padding:var(--s5);display:flex;flex-direction:column;gap:var(--s2);box-shadow:var(--e1);
  animation:popIn .4s both;min-height:0}
.point:nth-child(2){animation-delay:.06s}
.point:nth-child(3){animation-delay:.12s}
.point:nth-child(4){animation-delay:.18s}
.pt-hd{display:flex;align-items:center;gap:var(--s3)}
.pt-ico{width:2.1rem;height:2.1rem;border-radius:var(--r1);background:var(--ac-bg);
  color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pt-ico .ico{width:1.2rem;height:1.2rem;stroke-width:1.7}
.pt-ttl{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.01em}
.pt-txt{font-size:0.95rem;font-weight:500;color:var(--ink-body);line-height:1.6;
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ac-bd) transparent}
.pt-txt::-webkit-scrollbar{width:4px}
.pt-txt::-webkit-scrollbar-thumb{background:var(--ac-bd);border-radius:2px}
.pt-txt strong{font-weight:700;color:var(--ink)}

.keep{background:var(--ac);color:var(--on-ac);border-radius:var(--r3);
  padding:var(--s4) var(--s6);display:flex;align-items:center;gap:var(--s4);flex-shrink:0}
.keep .ico{width:1.6rem;height:1.6rem;stroke-width:1.7}
.keep-lbl{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  opacity:.75;margin-bottom:2px}
.keep-txt{font-size:0.95rem;font-weight:700;line-height:1.45}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<!--ICONS:START-->
<svg style="display:none" aria-hidden="true">
<symbol id="ico-aide" viewBox="0 0 24 24"><title>Aide</title><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a2.8 2.8 0 1 1 3.6 3.6c-.7.3-.9.8-.9 1.6"/><path d="M12 17.4v.1"/></symbol>
<symbol id="ico-alerte" viewBox="0 0 24 24"><title>Alerte</title><path d="M12 3.4 21.6 20H2.4Z"/><path d="M12 9.6v4.6"/><path d="M12 17.2v.1"/></symbol>
<symbol id="ico-balance" viewBox="0 0 24 24"><title>Balance</title><rect x="2.8" y="7.2" width="18.4" height="2.8" rx="1.4"/><path d="M5.6 10v7.4a2.2 2.2 0 0 0 2.2 2.2h8.4a2.2 2.2 0 0 0 2.2-2.2V10"/><path d="M9 13.6h6"/><path d="M9 16.4h3.4"/></symbol>
<symbol id="ico-cadenas" viewBox="0 0 24 24"><title>Verrouillé</title><rect x="4.6" y="10.4" width="14.8" height="10.2" rx="2.2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/></symbol>
<symbol id="ico-cible" viewBox="0 0 24 24"><title>Objectif</title><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.4"/><circle cx="12" cy="12" r="1.8"/></symbol>
<symbol id="ico-dossier" viewBox="0 0 24 24"><title>Dossier</title><path d="M2.8 6.6a2 2 0 0 1 2-2h4l2.4 2.8h8a2 2 0 0 1 2 2v8.6a2 2 0 0 1-2 2H4.8a2 2 0 0 1-2-2Z"/></symbol>
<symbol id="ico-eclair" viewBox="0 0 24 24"><title>Éclair</title><path d="M13.6 2.4 4.8 13.6h6.2l-1.2 8 9-11.2h-6.2Z"/></symbol>
<symbol id="ico-epingle" viewBox="0 0 24 24"><title>Épingler</title><path d="M9 3.6h6l-.8 6 3.4 3.2H6.4L9.8 9.6Z"/><path d="M12 12.8v7.6"/></symbol>
<symbol id="ico-euro" viewBox="0 0 24 24"><title>Euro</title><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4a4.4 4.4 0 0 0-6.8 3.6 4.4 4.4 0 0 0 6.8 3.6"/><path d="M7.4 10.8h5.4M7.4 13.4h5.4"/></symbol>
<symbol id="ico-fichier" viewBox="0 0 24 24"><title>Fichier</title><path d="M13.4 2.8H7a2 2 0 0 0-2 2v14.4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.4Z"/><path d="M13.4 2.8v5.6H19"/></symbol>
<symbol id="ico-horloge-pointeuse" viewBox="0 0 24 24"><title>Pointeuse</title><circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.6 2.2"/></symbol>
<symbol id="ico-mail" viewBox="0 0 24 24"><title>Courriel</title><rect x="2.6" y="5" width="18.8" height="14" rx="2.2"/><path d="m2.6 7 9.4 6.4L21.4 7"/></symbol>
<symbol id="ico-minuteur" viewBox="0 0 24 24"><title>Minuteur</title><circle cx="12" cy="13.2" r="7.8"/><path d="M12 9v4.2l2.8 1.8"/><path d="M9.4 2.6h5.2"/></symbol>
<symbol id="ico-niveau" viewBox="0 0 24 24"><title>Niveau</title><rect x="3.4" y="14.6" width="4.4" height="6.4" rx="1.2"/><rect x="9.8" y="10.2" width="4.4" height="10.8" rx="1.2"/><rect x="16.2" y="5.4" width="4.4" height="15.6" rx="1.2"/></symbol>
<symbol id="ico-oeil" viewBox="0 0 24 24"><title>Voir</title><path d="M2.4 12s3.6-6.4 9.6-6.4S21.6 12 21.6 12s-3.6 6.4-9.6 6.4S2.4 12 2.4 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="ico-signature" viewBox="0 0 24 24"><title>Signature</title><path d="M3 18.6c3-.4 4.4-4 5.4-7.6s2-6.4 3.4-6.4 1.6 2.4.6 5.4-3.4 8.6-1.4 8.6c1.4 0 2.6-2.6 4-2.6s1.6 2.6 3 2.6h3"/></symbol>
</svg>
<!--ICONS:END-->

<div class="top">
  <div class="ttl">
    <div class="h1">Les missions du back office, l'essentiel</div>
    <div class="sub">Trois onglets, douze points · la fiche à relire avant une session de contrôle</div>
  </div>
  <div class="top-right">
    <span class="mini-badge">
      <svg class="ico" aria-hidden="true"><use href="#ico-epingle"/></svg> L'essentiel
    </span>
    <div class="zoom-ctrl" role="group" aria-label="Zoom">
      <button class="zoom-btn" id="zoomOut" aria-label="Réduire" title="Réduire">−</button>
      <button class="zoom-val" id="zoomReset" aria-label="Réinitialiser le zoom" title="Réinitialiser">100%</button>
      <button class="zoom-btn" id="zoomIn" aria-label="Agrandir" title="Agrandir">+</button>
    </div>
  </div>
</div>

<div class="tabs" role="tablist" id="tabs"></div>
<div id="panels" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>

<script>
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
/* Gamification minimale imposée par le type 13 : un son doux, aucun score. */
const SNDS={doux:()=>tn(880,1100,.14,.03,0,'sine')};

const ONGLETS=[
{id:"comprendre",label:"Comprendre",ico:"ico-aide", keep:"Le back office contrôle ce qui est déjà saisi : plus l'erreur est vue tôt, moins elle coûte.",
 points:[
  {ico:"ico-balance",ttl:"Deux temps, un seul métier",
   txt:"Le <strong>front office</strong> exige la disponibilité immédiate, l'interruption permanente, la décision en quelques secondes sur une information incomplète ; il traite ce qui se présente, dans l'ordre où cela se présente. Le <strong>back office</strong> exige la continuité, la méthode et la patience de vérifier ce qui paraît juste ; il traite ce qui s'est passé, dans l'ordre qu'il choisit. Ce sont deux temps du même métier, tenus par la même personne sur les mêmes dossiers. Aucun des deux n'est le service après-vente de l'autre."},
  {ico:"ico-cible",ttl:"Pourquoi contrôler ce qui est déjà saisi",
   txt:"Celui qui saisit et celui qui contrôle <strong>ne voient pas la même chose</strong>. Le serveur qui porte une consommation sur une chambre lit un numéro annoncé à voix haute dans le bruit ; le poste qui contrôle le lendemain lit un relevé complet, à côté d'un autre relevé, au calme. Le premier ne peut pas voir ce que le second voit, et aucun effort supplémentaire au moment de la saisie n'y changerait quoi que ce soit. C'est la structure du travail qui crée l'erreur, jamais la négligence — et le dire ainsi change la manière dont le contrôle est reçu par les autres services."},
  {ico:"ico-euro",ttl:"Le coût dépend du moment, pas du montant",
   txt:"<strong>En back office</strong> : une correction, une ligne de trace, deux minutes, personne d'autre dérangé. <strong>Au départ du client</strong> : une discussion au comptoir, un justificatif à retrouver, une file qui s'allonge — même montant, temps décuplé. <strong>Après le départ</strong> : un courriel, une pièce rectificative, un remboursement à instruire, parfois un avis en ligne ; le dossier passe par trois personnes et la maison répond d'une chose qu'elle ne peut plus montrer. <strong>Non trouvée</strong> : une prestation servie et non facturée reste une perte sèche."},
  {ico:"ico-oeil",ttl:"Un travail invisible par construction",
   txt:"Le back office ne vend rien, n'accueille personne et ne produit aucune recette. Il produit des <strong>données dont on peut se servir</strong> : un compte contrôlé, un débiteur à jour, un indicateur calculé sur des chiffres justes. Aucune de ces productions ne se voit dans la journée où elle est faite ; toutes se voient le jour où elles manquent. C'est la difficulté propre de la mission — elle ne donne aucun signe de réussite, seulement l'absence des ennuis qu'elle a écartés."}]},

{id:"organiser",label:"S'organiser",ico:"ico-minuteur", keep:"Le back office est un temps, organisé toujours dans le même ordre.",
 points:[
  {ico:"ico-horloge-pointeuse",ttl:"Un temps, pas un lieu",
   txt:"Dans la plupart des maisons, le back office se fait au même comptoir, sur le même écran, entre deux arrivées. Trois conséquences. Il faut le <strong>décider</strong> : un créneau non choisi n'existera pas, parce que le comptoir remplit toujours le temps qu'on lui laisse. Il sera <strong>interrompu</strong>, systématiquement, et la méthode doit le prévoir plutôt que l'espérer absent. Il faut pouvoir <strong>reprendre</strong> où l'on en était, ce qui suppose une trace visible du point d'arrêt. Un créneau annoncé à l'équipe vaut mieux qu'un créneau gardé pour soi."},
  {ico:"ico-niveau",ttl:"Quatre temps, toujours le même ordre",
   txt:"<strong>Rassembler et dater</strong> toutes les pièces de la journée traitée : une session commencée avec une pièce manquante devra reprendre au début. <strong>Contrôler les comptes clients</strong> contre les relevés des services, ligne par ligne — le cœur du travail, placé quand l'attention est entière. <strong>Mettre à jour les débiteurs</strong>, qui dépendent entièrement du contrôle précédent. <strong>Classer, archiver, transmettre</strong> : la partie qu'on sacrifie quand le temps manque, et celle qui coûte le plus cher à sacrifier."},
  {ico:"ico-eclair",ttl:"Travailler en sachant qu'on sera coupé",
   txt:"Ce qui distingue une session utile d'une session perdue n'est pas le nombre d'interruptions mais le <strong>coût de la reprise</strong>. Trois habitudes le réduisent à presque rien. On travaille <strong>une pièce à la fois</strong>, posée bien en vue, plutôt que six ouvertes en parallèle. On <strong>coche au fur et à mesure</strong> ce qui est contrôlé, sur le document lui-même. On s'interrompt <strong>entre deux lignes</strong>, jamais au milieu d'un rapprochement commencé. Sur quarante minutes, l'écart entre les deux méthodes est de onze comptes contrôlés contre vingt-neuf."},
  {ico:"ico-alerte",ttl:"Les trois erreurs de début",
   txt:"Commencer par ce qui est sur le dessus de la pile, faute d'avoir choisi. Ouvrir six documents à la fois pour aller plus vite, et perdre le fil à la première coupure. Garder pour soi ce qui bloque, en pensant le débloquer avant la fin de la session. Elles ont un point commun, et c'est ce qui les rend faciles à corriger : toutes les trois consistent à <strong>commencer avant d'avoir décidé</strong> quelque chose — l'ordre, le périmètre, ce qui sort de la session."}]},

{id:"classer",label:"Classer et transmettre",ico:"ico-dossier", keep:"Classer, c'est permettre à un autre de retrouver la pièce sans vous.",
 points:[
  {ico:"ico-fichier",ttl:"Classer pour retrouver",
   txt:"Un classement ne sert pas à ranger, il sert à <strong>retrouver</strong>. La question n'est donc pas « où mettre cette pièce » mais « comment sera-t-elle cherchée dans six mois ». Dans la quasi-totalité des cas, elle sera cherchée par une date, parfois par un nom, presque jamais par un type de document. Quatre principes : un classement par journée d'exploitation puis par mois puis par année ; les pièces d'une même journée ensemble, quel que soit leur service d'origine ; une seule arborescence pour le service ; rien dans un tiroir personnel."},
  {ico:"ico-cadenas",ttl:"Ce qui s'archive et combien de temps",
   txt:"Les <strong>pièces comptables</strong> relèvent d'obligations de conservation que la comptabilité de la maison connaît, et qui se comptent en années. Les <strong>données personnelles</strong> se conservent le temps de la finalité qui les a fait recueillir, et pas au-delà. Les <strong>documents de travail</strong> — brouillons, listes cochées, notes de contrôle — n'ont aucune valeur probante une fois le contrôle terminé et encombrent tout le reste. La règle de conservation appartient à la maison et elle est écrite : un poste qui décide seul se trompe dans les deux sens."},
  {ico:"ico-signature",ttl:"Ce qui fait foi, ce qui ne fait foi de rien",
   txt:"<strong>Font foi</strong> : la facture éditée et numérotée, le ticket signé du point de vente, l'édition du logiciel non modifiable, la lettre de prise en charge d'une société. <strong>Ne font foi de rien</strong> : une note manuscrite non datée, un message oral rapporté, une capture d'écran, un fichier tableur modifiable. Entre les deux, la main courante, qui ne prouve pas un montant mais établit qu'un fait a été constaté à une heure donnée, par quelqu'un de nommé."},
  {ico:"ico-mail",ttl:"Demander sans interrompre",
   txt:"Au comptoir on interpelle ; en back office on écrit et on attend. La <strong>demande écrite précise</strong> nomme la journée, la ligne et la question en trois lignes : une demande floue revient avec une réponse floue et le délai double. Le <strong>regroupement</strong> vaut mieux que la dispersion — cinq questions dans un message obtiennent une réponse, cinq messages en obtiennent une ou deux. Le <strong>passage de vive voix</strong> se réserve à ce qui bloque, hors coup de feu du service concerné."}]}
];

const $=id=>document.getElementById(id);
let actif=0;

function peint(){
  $('tabs').innerHTML=ONGLETS.map((o,i)=>
    `<button class="tab${i===actif?' is-on':''}" role="tab" data-i="${i}"
       aria-selected="${i===actif}" aria-controls="p${o.id}">
      <svg class="ico" aria-hidden="true"><use href="#${o.ico}"/></svg>${o.label}
    </button>`).join('');
  $('panels').innerHTML=ONGLETS.map((o,i)=>
    `<section class="panel${i===actif?' is-on':''}" id="p${o.id}" role="tabpanel">
      <div class="grid">${o.points.map(p=>
        `<div class="point">
          <div class="pt-hd">
            <span class="pt-ico"><svg class="ico" aria-hidden="true"><use href="#${p.ico}"/></svg></span>
            <span class="pt-ttl">${p.ttl}</span>
          </div>
          <div class="pt-txt">${p.txt}</div>
        </div>`).join('')}</div>
      <div class="keep">
        <svg class="ico" aria-hidden="true"><use href="#ico-epingle"/></svg>
        <div><div class="keep-lbl">À retenir</div><div class="keep-txt">${o.keep}</div></div>
      </div>
    </section>`).join('');
  document.querySelectorAll('.tab').forEach(b=>{
    b.addEventListener('click',()=>{actif=+b.dataset.i;SNDS.doux();peint()});
    b.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        e.preventDefault();
        actif=(actif+(e.key==='ArrowRight'?1:ONGLETS.length-1))%ONGLETS.length;
        SNDS.doux();peint();
        document.querySelectorAll('.tab')[actif].focus();
      }});
  });
}

(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
