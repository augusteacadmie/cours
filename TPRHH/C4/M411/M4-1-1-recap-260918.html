<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Du front au back office · Récap</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  --r1:8px;--r2:12px;--r3:16px;--r4:20px;--rf:999px;
  --e1:0 1px 3px rgba(0,0,0,.06);--e2:0 4px 16px rgba(0,0,0,.08);--e3:0 12px 32px -8px rgba(0,0,0,.22);
  --ink:#323232;--ink-body:#323232;--ink-soft:#6B6560;--line:rgba(0,0,0,.10);
  --surface:#FAFAFA;
  --paper:#F2F3F5;--ac:#64748B;--on-ac:#FAFAFA;--ac-bg:#E1E5EA;--ac-bd:#7A899F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;min-height:100dvh;font-family:'Montserrat',sans-serif;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
/* Racine reduite de 20 % (design-tokens.md §1) : le reglage precedent
   (17-22px) poussait le contenu hors de l'ecran sur les formats moyens.
   Corps de texte effectif : 13 a 17,5px. Aucun token individuel retouche. */
html{font-size:calc(clamp(13.5px, 0.84vw + 8px, 17.5px) * var(--z, 1))}
body{background:var(--paper);padding:var(--s5);
  padding-bottom:calc(var(--s8) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;color:var(--ink-body)}
@media (min-width:881px){
  html,body{height:100%;min-height:0;overflow:hidden}
  body{padding:var(--s7);padding-bottom:var(--s7)}
}
html.zoomed,html.zoomed body{height:auto;min-height:100%;overflow:auto}
.ico{width:1.25em;height:1.25em;flex-shrink:0;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s4);
  margin-bottom:var(--s5);flex-wrap:wrap}
.h1{font-size:1.5rem;font-weight:800;color:var(--ink);margin-bottom:var(--s1);
  letter-spacing:-.01em;line-height:1.2}
.sub{font-size:0.85rem;font-weight:500;color:var(--ink-soft)}
.top-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.zoom-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:3px;flex-shrink:0}
.zoom-btn,.zoom-val{font-family:inherit;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);font-weight:800;transition:background .15s;border-radius:var(--r1)}
.zoom-btn{width:1.6rem;height:1.6rem;font-size:0.95rem;line-height:1;
  display:flex;align-items:center;justify-content:center}
.zoom-btn:hover,.zoom-val:hover{background:var(--ac-bg);color:var(--ink)}
.zoom-val{min-width:2.6rem;height:1.6rem;font-size:0.68rem;letter-spacing:.02em}
.hud{display:flex;align-items:center;gap:var(--s4);background:var(--surface);
  border:1.5px solid var(--line);border-radius:var(--r2);padding:var(--s2) var(--s4);
  flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:var(--s2)}
.badge-med{width:2.2rem;height:2.2rem;border-radius:var(--rf);background:var(--ac);
  color:var(--on-ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.badge-med .ico{width:1.2rem;height:1.2rem;stroke-width:1.7}
.badge-txt{display:flex;flex-direction:column;gap:1px}
.hud-lbl{font-size:0.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft)}
.badge-name{font-size:0.85rem;font-weight:800;color:var(--ink);line-height:1.2}
.xp{display:flex;flex-direction:column;gap:3px;min-width:8rem}
.xp-bar{height:6px;background:var(--ac-bd);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:var(--ac);width:0;transition:width .7s cubic-bezier(.4,0,.2,1)}
.xp-val{font-size:0.68rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stage{flex:1;display:flex;gap:var(--s5);min-height:0}
@media (max-width:880px){.stage{flex-direction:column}}
.sidebar{width:clamp(200px,22vw,300px);flex-shrink:0;background:var(--ac);
  border-radius:var(--r4);padding:var(--s4) var(--s3);display:flex;flex-direction:column;
  gap:var(--s2);box-shadow:none;min-height:0}
@media (max-width:880px){.sidebar{width:100%}}
.side-ttl{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-ac);padding:0 var(--s2) var(--s2)}
.step-list{display:flex;flex-direction:column;gap:var(--s2);min-height:0}
.step{width:100%;text-align:left;font-family:inherit;font-size:0.85rem;font-weight:700;
  color:var(--on-ac);background:transparent;border:1.5px solid transparent;
  border-radius:var(--r2);padding:var(--s2) var(--s3);min-height:48px;cursor:pointer;
  display:flex;align-items:center;gap:var(--s2);line-height:1.3;
  transition:background .16s,border-color .16s;animation:slideUp .3s both}
.step:hover{background:var(--ac-bd)}
.step.on{background:var(--surface);border-color:var(--surface);color:var(--ink)}
.step-n{font-size:0.68rem;font-weight:800;min-width:1.1rem;opacity:.75}
.step-ok{margin-left:auto;font-weight:800}
.schema-card{background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r4);padding:var(--s6);flex:1;display:flex;flex-direction:column;
  min-height:0;gap:var(--s4);animation:fadeUp .4s both}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;
  gap:var(--s3);flex-wrap:wrap}
.card-t{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.25;
  letter-spacing:-.01em}
.card-st{font-size:0.8rem;font-weight:600;color:var(--ink-soft);font-style:italic}
.pill{display:inline-flex;align-items:center;gap:var(--s1);padding:3px var(--s3);
  border-radius:var(--rf);background:var(--ac);color:var(--on-ac);font-size:0.68rem;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;flex-shrink:0}
.figure{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r3);
  padding:var(--s4)}
.fig-svg{width:100%;height:auto;display:block;max-height:11rem}
.fig-r{fill:var(--surface);stroke:#6B6560;stroke-width:1.6}
.fig-a{fill:#FAFAFA;stroke:#7A899F;stroke-width:1.6}
.fig-b{fill:#E1E5EA;stroke:#64748B;stroke-width:1.6}
.fig-l{stroke:#6B6560;stroke-width:1.6;fill:none}
.fig-t{font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;fill:#323232}
.fig-t.mid{text-anchor:middle}
.fig-t.end{text-anchor:end}
.fig-t.soft{font-weight:600;fill:#6B6560}
.quick-stat{display:flex;justify-content:space-around;padding:var(--s3) var(--s4);
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r2);
  gap:var(--s3);flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-size:1.35rem;font-weight:800;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat-lbl{font-size:0.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft)}
.body{font-size:0.95rem;font-weight:500;color:var(--ink-body);line-height:1.6}
.body strong{font-weight:700;color:var(--ink)}
.vigilance{padding:var(--s4) var(--s5);border-radius:var(--r3);font-size:0.9rem;
  font-weight:500;line-height:1.6;border-left:3px solid var(--ac);background:var(--ac-bg);
  color:var(--ink)}
.scroll-zone{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ac-bd) transparent}
.scroll-zone::-webkit-scrollbar{width:4px}
.scroll-zone::-webkit-scrollbar-track{background:transparent}
.scroll-zone::-webkit-scrollbar-thumb{background:var(--ac-bd);border-radius:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.nbtn{font-family:inherit;font-size:0.8rem;font-weight:700;padding:var(--s3) var(--s5);
  min-height:48px;border-radius:var(--r2);border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;transition:background .18s;
  display:inline-flex;align-items:center;gap:var(--s2)}
.nbtn:hover:not(:disabled){background:var(--ac-bg)}
.nbtn:disabled{opacity:.4;cursor:default}
.nbtn.primary{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.nbtn.primary:hover:not(:disabled){background:var(--ac-bd)}
.dots-nav{display:flex;gap:6px;align-items:center}
.dot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--ac-bd);opacity:.45;
  cursor:pointer;transition:transform .18s,opacity .18s}
.dot:hover{transform:scale(1.3);opacity:.8}
.dot.done{opacity:1;background:var(--ac);outline:1.5px solid #6B6560}
.dot.now{opacity:1;transform:scale(1.3);background:var(--ac);
  outline:2px solid var(--ink);outline-offset:2px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--s3);text-align:center;border:2px dashed var(--ac-bd);border-radius:var(--r3);
  padding:var(--s6)}
.welcome-ico{color:var(--ink-soft)}
.welcome-ico .ico{width:2.8rem;height:2.8rem;stroke-width:1.5}
.welcome-h{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.welcome-t{font-size:0.9rem;font-weight:500;color:var(--ink-soft);line-height:1.6;max-width:26rem}
.welcome-cta{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--on-ac);background:var(--ac);padding:var(--s1) var(--s3);border-radius:var(--r1)}
.confetti{position:fixed;width:9px;height:9px;border-radius:2px;top:-20px;
  pointer-events:none;z-index:60;animation:fall linear forwards}
.toast{position:fixed;left:50%;bottom:var(--s7);transform:translateX(-50%) translateY(140%);
  background:var(--surface);border:1.5px solid var(--ac-bd);border-radius:var(--r3);
  padding:var(--s4) var(--s6);box-shadow:var(--e2);text-align:center;z-index:70;
  transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:min(92vw,26rem);
  display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast-med{width:2.6rem;height:2.6rem;border-radius:var(--rf);background:var(--ac);
  color:var(--on-ac);display:flex;align-items:center;justify-content:center}
.toast-med .ico{width:1.5rem;height:1.5rem;stroke-width:1.6}
.toast-h{font-size:0.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft)}
.toast-name{font-size:1.25rem;font-weight:800;color:var(--ink);line-height:1.2}
.toast-tag{font-size:0.85rem;font-weight:500;color:var(--ink-soft);font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>

<div class="top">
  <div class="ttl">
    <div class="h1">De la file qui décide aux dossiers signalés</div>
    <div class="sub">Sept cartes de synthèse · marquez chacune comme acquise</div>
  </div>
  <div class="top-right">
    <div class="hud">
      <div class="badge">
        <div class="badge-med" id="badgeMed">
          <svg class="ico" aria-hidden="true"><use href="#ico-pensif"/></svg></div>

  <aside class="sidebar">

  <main class="schema-card" id="main"></main>

</div>

<script>
let AC;
const ga=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC};
function tn(f1,f2,d,v,dl,tp){try{const a=ga(),o=a.createOscillator(),g=a.createGain();
o.connect(g);g.connect(a.destination);o.type=tp||'sine';const t=a.currentTime+(dl||0);
o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.8);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.start(t);o.stop(t+d+.02)}catch(e){}}
function ns(lp,v,d,dl){try{const a=ga(),buf=a.createBuffer(1,~~(a.sampleRate*d),a.sampleRate),
dat=buf.getChannelData(0);for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();
f.type='bandpass';f.frequency.value=lp;f.Q.value=2;const g=a.createGain();
const t=a.currentTime+(dl||0);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.04);
g.gain.linearRampToValueAtTime(0,t+d);src.connect(f);f.connect(g);g.connect(a.destination);
src.start(t);src.stop(t+d+.05)}catch(e){}}
document.addEventListener('click',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{once:true});
const SNDS={
  hover:()=>tn(1000,1200,.06,.03,0,'triangle'),
  select:()=>{[523,654,784].forEach((f,i)=>tn(f,f,.15,.045,i*.06,'triangle'))},
  acquis:()=>{ns(2200,.02,.08,0);[659,988].forEach((f,i)=>tn(f,f,.2,.05,i*.07,'triangle'))},
  rang:()=>{tn(1568,1568,.55,.05,0,'sine');tn(2093,2093,.45,.03,.03,'sine');
            [523,784,1047].forEach((f,i)=>tn(f,f,.3,.05,.12+i*.1,'triangle'))}
};

const CARTES=[
{n:1,pill:"Le renversement",titre:"Personne n'est devant vous",
 st:"On passe d'un ordre imposé à un ordre à décider",
 stats:[["30","secondes dictées au comptoir"],["0","file en back office"],["1","décision à prendre"]],
 body:"Au comptoir, l'ordre du travail est donné par la file : le client qui se présente décide de ce que vous ferez dans les trente secondes qui viennent. Cette contrainte est épuisante et elle rend un service — personne n'a jamais à se demander par quoi commencer. En back office, les documents attendent, aucun ne réclame, et rien dans la pièce ne dit lequel ouvrir en premier.",
 rule:"Un poste qui ne s'en aperçoit pas traite ce qui se trouve sur le dessus de la pile, ce qui revient à laisser l'ordre d'arrivée du courrier organiser sa matinée.",
 svg:`<svg class="fig-svg" viewBox="0 0 320 176" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Au comptoir la file décide, en back office personne ne décide">
  <rect class="fig-a" x="10" y="14" width="140" height="44" rx="5"/>
  <text class="fig-t soft mid" x="80" y="41">Au comptoir</text>
  <rect class="fig-b" x="170" y="14" width="140" height="44" rx="5"/>
  <text class="fig-t soft mid" x="240" y="41">En back office</text>
  <text class="fig-t soft mid" x="80" y="80">la file décide</text>
  <text class="fig-t soft mid" x="240" y="80">personne</text>
  <rect class="fig-a" x="10" y="96" width="300" height="32" rx="5"/>
  <text class="fig-t" x="24" y="117">L'ordre se décide</text>
  <text class="fig-t soft mid" x="160" y="152">Une contrainte qui rendait service</text>
 </svg>`},

{n:2,pill:"Deux temps",titre:"Un seul métier, deux exigences",
 st:"La même personne, les mêmes dossiers, la même journée",
 stats:[["2","temps"],["1","métier"],["0","service après-vente"]],
 body:"Le <strong>front</strong> exige la disponibilité immédiate, l'interruption permanente, la décision en quelques secondes sur une information incomplète. Le <strong>back</strong> exige la continuité, la méthode et la patience de vérifier ce qui paraît juste. Le premier traite ce qui se présente, dans l'ordre où cela se présente ; le second traite ce qui s'est passé, dans l'ordre qu'il choisit.",
 rule:"Ce que le front office saisit vite, le back office le contrôle lentement. Ce que le back office corrige, le front office l'aurait porté au client sans jamais le savoir.",

  <rect class="fig-a" x="10" y="12" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="32">Le front</text>
  <text class="fig-t soft end" x="298" y="32">l'interruption</text>
  <rect class="fig-a" x="10" y="46" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="66">Le back</text>
  <text class="fig-t soft end" x="298" y="66">la continuité</text>
  <rect class="fig-b" x="10" y="80" width="300" height="30" rx="5"/>
  <text class="fig-t" x="24" y="100">En commun</text>
  <text class="fig-t soft end" x="298" y="100">les mêmes dossiers</text>
  <text class="fig-t soft mid" x="160" y="140">Deux exigences opposées</text>
 </svg>`},

{n:3,pill:"Pourquoi contrôler",titre:"La structure crée l'erreur",

const RANKS=[
 {min:0,name:"Ordre à décider",ico:"ico-pensif",tag:"« Personne n'est devant vous. »"},
 {min:200,name:"Mission comprise",ico:"ico-niveau",tag:"« La structure crée l'erreur, pas la négligence. »"},
 {min:400,name:"Sources identifiées",ico:"ico-badge",tag:"« Deux origines, une comparaison. »"},
 {min:600,name:"Session organisée",ico:"ico-medaille",tag:"« Rassembler, contrôler, mettre à jour, classer. »"},
 {min:700,name:"Back office tenu",ico:"ico-trophee",tag:"« La reprise gratuite vaut mieux qu'une heure sans interruption. »"}
];
const rankOf=x=>RANKS.filter(r=>x>=r.min).pop();

const $=id=>document.getElementById(id);
const XP_CARTE=100, XP_MAX=CARTES.length*XP_CARTE;
let acquises=new Set(),courante=null,rangCourant=RANKS[0].name;

function peintSidebar(){
  $('stepList').innerHTML=CARTES.map(c=>
    `<button class="step${courante===c.n?' on':''}" data-n="${c.n}">
      <span class="step-n">${c.n}</span><span>${c.titre}</span>
      ${acquises.has(c.n)?'<span class="step-ok" aria-label="acquise">✓</span>':''}
    </button>`).join('');
  document.querySelectorAll('.step').forEach(b=>{
    b.addEventListener('mouseenter',()=>SNDS.hover());
    b.addEventListener('click',()=>{SNDS.select();ouvre(+b.dataset.n)})});
}
function welcome(){
  $('main').innerHTML=`
  <div class="welcome">
    <div class="welcome-ico"><svg class="ico" aria-hidden="true"><use href="#ico-cloche-reception"/></svg></div>
    <div class="welcome-h">Sept cartes, de la file qui décide à la nuit qui prépare</div>
    <div class="welcome-t">De la contrainte qui disparaît en quittant le comptoir jusqu'aux dossiers que la nuit laisse en attente, en passant par les quatre étapes du coût d'une erreur, les trois familles de documents du contrôle et les quatre temps d'une session de back office. Marquez une carte comme acquise pour progresser.</div>
    <div class="welcome-cta">Choisissez une carte</div>
  </div>`;
}
function ouvre(n){
  const c=CARTES.find(x=>x.n===n);courante=n;
  $('main').innerHTML=`
    <div class="card-hd">
      <div><div class="card-t">${c.titre}</div><div class="card-st">${c.st}</div></div>
      <span class="pill">${c.pill}</span>
    </div>
    <div class="scroll-zone" style="display:flex;flex-direction:column;gap:var(--s4);min-height:0">
      <div class="figure">${c.svg}</div>
      <div class="quick-stat">${c.stats.map(([v,l])=>
        `<div class="stat"><div class="stat-val">${v}</div><div class="stat-lbl">${l}</div></div>`).join('')}</div>
      <div class="body">${c.body}</div>
      <div class="vigilance">${c.rule}</div>
    </div>
    <div class="bar">
      <div class="dots-nav" id="dots"></div>
      <button class="nbtn primary" id="acq" ${acquises.has(n)?'disabled':''}>
        <svg class="ico" aria-hidden="true"><use href="#ico-valider"/></svg>
        ${acquises.has(n)?'Carte acquise':'Marquer comme acquise'}
      </button>
    </div>`;
  peintDots();peintSidebar();
  $('acq').addEventListener('click',()=>acquiert(n));
  if(window.matchMedia('(max-width:880px)').matches){
    $('main').scrollIntoView({behavior:'smooth',block:'start'})}
}
function peintDots(){
  $('dots').innerHTML=CARTES.map(c=>{
    let cl='dot';
    if(c.n===courante)cl+=' now';else if(acquises.has(c.n))cl+=' done';
    return `<span class="${cl}" data-n="${c.n}" role="button" tabindex="0" aria-label="Carte ${c.n}"></span>`
  }).join('');
  document.querySelectorAll('.dot').forEach(d=>{
    const go=()=>{SNDS.select();ouvre(+d.dataset.n)};
    d.addEventListener('click',go);
    d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
}
function acquiert(n){
  if(acquises.has(n))return;
  acquises.add(n);SNDS.acquis();majXp();peintSidebar();
  const b=$('acq');b.disabled=true;
  b.innerHTML='<svg class="ico" aria-hidden="true"><use href="#ico-valider"/></svg> Carte acquise';
  peintDots();
}
function majXp(){
  const xp=acquises.size*XP_CARTE;
  $('xpFill').style.width=(xp/XP_MAX*100)+'%';
  $('xpVal').textContent=xp+' / '+XP_MAX+' XP';
  const r=rankOf(xp);
  $('badgeName').textContent=r.name;
  $('badgeMed').innerHTML=`<svg class="ico" aria-hidden="true"><use href="#${r.ico}"/></svg>`;
  if(r.name!==rangCourant){
    rangCourant=r.name;
    $('toastMed').innerHTML=`<svg class="ico" aria-hidden="true"><use href="#${r.ico}"/></svg>`;
    $('toastName').textContent=r.name;$('toastTag').textContent=r.tag;
    const t=$('toast');t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),4200);
    SNDS.rang();confettis();
  }
}
function confettis(){
  const cols=['#64748B','#7A899F','#6B6560','#E1E5EA','#323232'];
  for(let i=0;i<55;i++){const c=document.createElement('div');c.className='confetti';
    c.style.background=cols[i%cols.length];c.style.left=Math.random()*100+'vw';
    c.style.animationDelay=(Math.random()*.6)+'s';
    c.style.animationDuration=(2+Math.random()*1.8)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4600)}}
(function(){
  const STEPS=[0.8,0.9,1,1.1,1.25,1.4,1.6];let i=STEPS.indexOf(1);
  const root=document.documentElement,val=$('zoomReset');
  function apply(){const z=STEPS[i];root.style.setProperty('--z',z);
    root.classList.toggle('zoomed',z>1);if(val)val.textContent=Math.round(z*100)+'%'}
  $('zoomIn').addEventListener('click',()=>{i=Math.min(i+1,STEPS.length-1);apply()});
  $('zoomOut').addEventListener('click',()=>{i=Math.max(i-1,0);apply()});
  val.addEventListener('click',()=>{i=STEPS.indexOf(1);apply()});apply()})();
peintSidebar();welcome();majXp();
</script>
</body>
</html>
